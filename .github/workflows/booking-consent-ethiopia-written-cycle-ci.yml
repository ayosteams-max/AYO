          def verify(raw):
              if len(raw) not in range(1, 16385) or raw.startswith(b"\xef\xbb\xbf") or b"\r" in raw or b"\x00" in raw or not raw.endswith(b"\n"):
                  raise ValueError("evidence byte contract")
              text = raw.decode("utf-8")
              if re.search(r"https?://|traceback|environment dump|raw scanner|source excerpt|legal correspondence|credential", text, re.I):
                  raise ValueError("unsafe evidence content")
              lines = text.splitlines()
              if len(lines) > 160 or lines[0] != MAGIC or lines[-1] != END:
                  raise ValueError("evidence envelope")
              cursor = 1; values = {}; order = []
              def field(line, expected):
                  if line.count("=") != 1:
                      raise ValueError("malformed field")
                  key, value = line.split("=", 1)
                  if key != expected or key in values:
                      raise ValueError("field inventory/order")
                  values[key] = value; order.append(key)
              for name in ENVELOPE:
                  field(lines[cursor], name); cursor += 1
              for marker, names in SECTION_FIELDS:
                  if lines[cursor] != marker:
                      raise ValueError("section start/order")
                  cursor += 1
                  for name in names:
                      field(lines[cursor], name); cursor += 1
                  if lines[cursor] != f"END_{marker}":
                      raise ValueError("section end/pairing")
                  cursor += 1
              if cursor != len(lines) - 1:
                  raise ValueError("unknown trailing content")
              if values["candidate_sha"] != os.environ["CANDIDATE_SHA"] or not re.fullmatch(r"[0-9a-f]{40}", values["candidate_sha"]):
                  raise ValueError("runtime candidate identity")
              for key, expected in FIXED_VALUES.items():
                  if values.get(key) != expected:
                      raise ValueError(f"fixed value: {key}")
              for key in PASS_FIELDS:
                  if values.get(key) != "PASS": raise ValueError(f"PASS field: {key}")
              for key in DECIMAL_FIELDS:
                  if not re.fullmatch(r"0|[1-9][0-9]*", values.get(key, "")): raise ValueError(f"decimal: {key}")
              for key in HEX40_FIELDS:
                  if not re.fullmatch(r"[0-9a-f]{40}", values.get(key, "")): raise ValueError(f"hex40: {key}")
              for key in HEX64_FIELDS:
                  if not re.fullmatch(r"[0-9a-f]{64}", values.get(key, "")): raise ValueError(f"hex64: {key}")
              if (
                  int(values["base_only_item_count"]) > int(values["base_item_count"])
                  or int(values["candidate_only_item_count"]) > int(values["candidate_item_count"])
                  or int(values["base_item_count"]) - int(values["base_only_item_count"])
                     + int(values["candidate_only_item_count"]) != int(values["candidate_item_count"])
              ):
                  raise ValueError("secret inventory arithmetic")
              normalized = re.sub(rb"(?m)^candidate_sha=[0-9a-f]{40}$", b"candidate_sha=" + b"0" * 40, raw)
              if normalized == raw or len(re.findall(rb"(?m)^candidate_sha=[0-9a-f]{40}$", raw)) != 1:
                  raise ValueError("candidate normalization")
              return hashlib.sha256(normalized).digest()

          ADMISSION_KEYS = (
              "schema", "admission_record_id", "candidate_commit", "candidate_tree",
              "companion_workflow_blob", "counsel_template_blob", "architecture_document_blob",
              "decision_log_blob", "roadmap_blob", "evidence_schema", "normalized_evidence_sha256",
              "jurisdiction_profile", "lifecycle_classification", "approval_status",
              "founder_approver", "technical_validation_checkpoint", "technical_review_record_blob", "approved_at_utc",
              "supersedes_admission_commit", "scope",
          )

          TRUST_RECORD_KEYS = (
              "schema", "authority_version", "record_id", "machine_principal", "founder_display_identity",
              "namespace", "key_role", "public_key_algorithm", "public_key_base64",
              "public_key_fingerprint", "status", "effective_from_checkpoint",
              "effective_until_utc", "predecessor_authority_blob", "scope", "jurisdiction_profile",
          )
          TRUST_RECORD_ROLES = ("PRIMARY", "RECOVERY")

          def parse_admission_record(raw):
              if not raw or raw.startswith(b"\xef\xbb\xbf") or b"\r" in raw or b"\x00" in raw or not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
                  raise ValueError("admission byte contract")
              try: text = raw.decode("ascii")
              except UnicodeDecodeError as error: raise ValueError("admission ASCII contract") from error
              lines = text.splitlines()
              if len(lines) != len(ADMISSION_KEYS) + 2 or lines[0] != "AYO_IMMUTABLE_ADMISSION_V2" or lines[-1] != "END_AYO_IMMUTABLE_ADMISSION_V2":
                  raise ValueError("admission envelope")
              values = {}
              for expected, line in zip(ADMISSION_KEYS, lines[1:-1]):
                  if line.count("=") != 1:
                      raise ValueError("admission field syntax")
                  key, value = line.split("=", 1)
                  if key != expected or not value or value != value.strip() or key in values:
                      raise ValueError("admission field order")
                  values[key] = value
              hex40 = re.compile(r"[0-9a-f]{40}")
              hex64 = re.compile(r"[0-9a-f]{64}")
              for key in ("candidate_commit", "candidate_tree", "companion_workflow_blob", "counsel_template_blob", "architecture_document_blob", "decision_log_blob", "roadmap_blob"):
                  if hex40.fullmatch(values[key]) is None: raise ValueError("admission git identity")
              if hex64.fullmatch(values["normalized_evidence_sha256"]) is None: raise ValueError("admission evidence identity")
              if values["schema"] != "AYO_IMMUTABLE_ADMISSION_V2" or values["evidence_schema"] != MAGIC:
                  raise ValueError("admission schema")
              expected_id = values["candidate_commit"] + "-" + values["normalized_evidence_sha256"]
              if values["admission_record_id"] != expected_id:
                  raise ValueError("admission record identity")
              if values["jurisdiction_profile"] != "ETHIOPIA" or values["lifecycle_classification"] != "PREPRODUCTION_EVIDENCE_ADMISSION" or values["scope"] != "NON_PRODUCTION_ETHIOPIA_WRITTEN_DECISION_CYCLE":
                  raise ValueError("admission scope")
              if values["approval_status"] != "APPROVED" or values["founder_approver"] != ADMISSION_FOUNDER_IDENTITY:
                  raise ValueError("admission approval authority")
              if re.fullmatch(r"CHECKPOINT_[A-Z0-9_]{16,160}", values["technical_validation_checkpoint"]) is None or hex40.fullmatch(values["technical_review_record_blob"]) is None:
                  raise ValueError("admission technical review binding")
              if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", values["approved_at_utc"]) is None:
                  raise ValueError("approved admission authority")
              try:
                  datetime.datetime.strptime(values["approved_at_utc"], "%Y-%m-%dT%H:%M:%SZ")
              except ValueError as error:
                  raise ValueError("approved admission UTC timestamp") from error
              prior = values["supersedes_admission_commit"]
              if prior != "NONE" and hex40.fullmatch(prior) is None:
                  raise ValueError("admission predecessor")
              return values

          def parse_trust_record(raw):
              if not raw or raw.startswith(b"\xef\xbb\xbf") or b"\r" in raw or b"\x00" in raw or not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
                  raise ValueError("admission trust byte contract")
              try: text = raw.decode("ascii")
              except UnicodeDecodeError as error: raise ValueError("admission trust ASCII contract") from error
              lines = text.splitlines()
              expected_line_count = 2 * len(TRUST_RECORD_KEYS) + 6
              if len(lines) != expected_line_count or lines[0] != "AYO_FOUNDER_ADMISSION_SIGNERS_V1" or lines[-1] != "END_AYO_FOUNDER_ADMISSION_SIGNERS_V1":
                  raise ValueError("admission trust envelope")
              records = []
              cursor = 1
              for role in TRUST_RECORD_ROLES:
                  if lines[cursor] != "BEGIN_" + role:
                      raise ValueError("admission trust record order")
                  cursor += 1
                  values = {}
                  for expected in TRUST_RECORD_KEYS:
                      line = lines[cursor]; cursor += 1
                      if line.count("=") != 1:
                          raise ValueError("admission trust field syntax")
                      key, value = line.split("=", 1)
                      if key != expected or not value or value != value.strip() or key in values or "*" in value or "?" in value:
                          raise ValueError("admission trust field order")
                      values[key] = value
                  if lines[cursor] != "END_" + role:
                      raise ValueError("admission trust record order")
                  cursor += 1
                  records.append(values)
              if cursor != len(lines) - 1:
                  raise ValueError("admission trust trailing content")
              if any(values["schema"] != "AYO_FOUNDER_ADMISSION_SIGNER_V1" or values["authority_version"] != "1" for values in records):
                  raise ValueError("admission trust schema")
              key_blobs = []
              for expected_role, values in zip(TRUST_RECORD_ROLES, records):
                  if values["record_id"] != "FOUNDER_ADMISSION_" + expected_role + "_V1" or values["key_role"] != expected_role:
                      raise ValueError("admission trust role or record identity")
                  if values["machine_principal"] != ADMISSION_MACHINE_PRINCIPAL or values["founder_display_identity"] != ADMISSION_FOUNDER_IDENTITY or values["namespace"] != "git":
                      raise ValueError("admission trust principal or namespace")
                  permitted_status = {"PRIMARY": {"ACTIVE", "REVOKED"}, "RECOVERY": {"STANDBY", "REVOKED"}}
                  if values["status"] not in permitted_status[expected_role] or values["public_key_algorithm"] != "sk-ssh-ed25519@openssh.com":
                      raise ValueError("admission trust key classification")
                  encoded_key = values["public_key_base64"]
                  if "=" in encoded_key or re.fullmatch(r"[A-Za-z0-9+/]+", encoded_key) is None:
                      raise ValueError("admission trust public key encoding")
                  try: key_blob = base64.b64decode(encoded_key + "=" * (-len(encoded_key) % 4), validate=True)
                  except Exception as error: raise ValueError("admission trust public key encoding") from error
                  if base64.b64encode(key_blob).decode("ascii").rstrip("=") != encoded_key or len(key_blob) < 8:
                      raise ValueError("admission trust public key canonical encoding")
                  offset = 0
                  def read_ssh_string():
                      nonlocal offset
                      if offset + 4 > len(key_blob): raise ValueError("admission trust public key structure")
                      length = int.from_bytes(key_blob[offset:offset + 4], "big"); offset += 4
                      if offset + length > len(key_blob): raise ValueError("admission trust public key structure")
                      value = key_blob[offset:offset + length]; offset += length
                      return value
                  algorithm = read_ssh_string().decode("ascii", errors="strict")
                  public_point = read_ssh_string()
                  application = read_ssh_string().decode("ascii", errors="strict")
                  if algorithm != values["public_key_algorithm"] or len(public_point) != 32 or application != "ssh:" or offset != len(key_blob):
                      raise ValueError("admission trust public key algorithm")
                  fingerprint = "SHA256:" + base64.b64encode(hashlib.sha256(key_blob).digest()).decode("ascii").rstrip("=")
                  if values["public_key_fingerprint"] != fingerprint:
                      raise ValueError("admission trust public key fingerprint")
                  if re.fullmatch(r"CHECKPOINT_[A-Z0-9_]{16,160}", values["effective_from_checkpoint"]) is None:
                      raise ValueError("admission trust effective authority")
                  if values["effective_until_utc"] != "NONE":
                      if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", values["effective_until_utc"]) is None:
                          raise ValueError("admission trust expiry")
                      try: datetime.datetime.strptime(values["effective_until_utc"], "%Y-%m-%dT%H:%M:%SZ")
                      except ValueError as error: raise ValueError("admission trust expiry") from error
                  if values["predecessor_authority_blob"] != "NONE" and re.fullmatch(r"[0-9a-f]{40}", values["predecessor_authority_blob"]) is None:
                      raise ValueError("admission trust predecessor")
                  if values["scope"] != "NON_PRODUCTION_ETHIOPIA_WRITTEN_DECISION_CYCLE" or values["jurisdiction_profile"] != "ETHIOPIA":
                      raise ValueError("admission trust scope")
                  key_blobs.append(key_blob)
              if len({values["record_id"] for values in records}) != 2 or len({values["key_role"] for values in records}) != 2:
                  raise ValueError("admission trust duplicate record or role")
              if len(set(key_blobs)) != 2 or len({values["public_key_fingerprint"] for values in records}) != 2:
                  raise ValueError("admission trust duplicate credential")
              return tuple(records), tuple(key_blobs)

          def controlled_git(*args, input_bytes=None, extra_config=()):
              environment = {
                  "PATH": os.environ.get("PATH", ""), "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": os.devnull, "GIT_CONFIG_COUNT": "0",
                  "GIT_NO_REPLACE_OBJECTS": "1", "LC_ALL": "C", "LANG": "C",
              }
              command = ["git", "--no-replace-objects"]
              for key, value in extra_config: command.extend(["-c", key + "=" + value])
              try: return subprocess.run(command + list(args), input=input_bytes, capture_output=True, check=False, env=environment)
              except FileNotFoundError as error: raise ValueError("admission signature verification tool unavailable") from error

          def verify_admission_signature(execution_sha, candidate_sha):
              trust = controlled_git("cat-file", "blob", f"{candidate_sha}:{ADMISSION_TRUST_PATH}")
              if trust.returncode:
                  raise ValueError("admission trust authority missing from candidate")
              records, key_blobs = parse_trust_record(trust.stdout)
              values, key_blob = records[0], key_blobs[0]
              if values["key_role"] != "PRIMARY" or values["status"] != "ACTIVE":
                  raise ValueError("admission trust authority revoked")
              if values["effective_until_utc"] != "NONE":
                  expiry = datetime.datetime.strptime(values["effective_until_utc"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
                  if datetime.datetime.now(datetime.timezone.utc) >= expiry:
                      raise ValueError("admission trust authority expired")
              with tempfile.TemporaryDirectory(prefix="ayo-admission-verify-") as temporary:
                  root = Path(temporary); root.chmod(0o700)
                  allowed = root / "allowed_signers"
                  allowed.write_text(
                      values["machine_principal"] + ' namespaces="git" ' + values["public_key_algorithm"] + " " + base64.b64encode(key_blob).decode("ascii") + "\n",
                      encoding="ascii", newline="\n",
                  )
                  allowed.chmod(0o600)
                  config = (("gpg.format", "ssh"), ("gpg.ssh.allowedSignersFile", str(allowed)), ("gpg.minTrustLevel", "fully"))
                  verified = controlled_git("verify-commit", "--raw", execution_sha, extra_config=config)
                  if verified.returncode:
                      raise ValueError("admission commit signature invalid or unsigned")
                  identity = controlled_git("show", "-s", "--format=%G?%x00%GF%x00%GS", execution_sha, extra_config=config)
                  if identity.returncode:
                      raise ValueError("admission signature identity unavailable")
                  fields = identity.stdout.rstrip(b"\n").decode("ascii", errors="strict").split("\x00")
                  if fields != ["G", values["public_key_fingerprint"], values["machine_principal"]]:
                      raise ValueError("admission signature principal or fingerprint mismatch")
              return values

          def git_text(*args):
              result = controlled_git(*args)
              if result.returncode: raise ValueError("admission Git object authority")
              return result.stdout

          def validate_admission_topology(execution_sha, candidate_sha, commitment):
              if not re.fullmatch(r"[0-9a-f]{40}", execution_sha) or not re.fullmatch(r"[0-9a-f]{40}", candidate_sha):
                  raise ValueError("admission runtime identity")
              parents = git_text("show", "-s", "--format=%P", execution_sha).decode("ascii").strip().split()
              if parents != [candidate_sha]: raise ValueError("admission direct parent")
              changed = git_text("diff-tree", "--no-commit-id", "--name-only", "-r", candidate_sha, execution_sha).decode("utf-8").splitlines()
              if changed != [ADMISSION_PATH]: raise ValueError("admission-only diff")
              if controlled_git("cat-file", "-e", f"{candidate_sha}:{ADMISSION_PATH}").returncode == 0:
                  raise ValueError("admission record already in candidate")
              raw = git_text("cat-file", "blob", f"{execution_sha}:{ADMISSION_PATH}")
              values = parse_admission_record(raw)
              if values["candidate_commit"] != candidate_sha or values["candidate_tree"] != git_text("rev-parse", f"{candidate_sha}^{{tree}}").decode("ascii").strip() or values["normalized_evidence_sha256"] != commitment.hex():
                  raise ValueError("admission candidate or evidence binding")
              object_fields = {
                  "companion_workflow_blob": ".github/workflows/booking-consent-ethiopia-written-cycle-ci.yml",
                  "counsel_template_blob": "docs/AYO_BOOKING_CONSENT_ETHIOPIA_COUNSEL_QUESTION_PACK_TEMPLATE.md",
                  "architecture_document_blob": "docs/AYO_BOOKING_CONSENT_ETHIOPIA_WRITTEN_DECISION_CYCLE_ARCHITECTURE.md",
                  "decision_log_blob": "docs/AYO_DECISION_LOG.md", "roadmap_blob": "docs/AYO_ROADMAP.md",
              }
              for field, governed_path in object_fields.items():
                  if values[field] != git_text("rev-parse", f"{candidate_sha}:{governed_path}").decode("ascii").strip():
                      raise ValueError("admission governed object binding")
              if values["approval_status"] != "APPROVED": raise ValueError("admission unresolved")
              return values

          path = Path(os.environ["EVIDENCE_PATH"]); raw = path.read_bytes()
          if path.is_symlink() or not path.is_file() or path.stat().st_nlink != 1 or path.stat().st_size != len(raw):
              raise SystemExit("ethiopia-written-cycle evidence file is unsafe")
          try: commitment = verify(raw)
          except (UnicodeError, ValueError) as error: raise SystemExit(f"ethiopia-written-cycle evidence verification failed: {error}") from error
          if ADMISSION_STATE == ACTIVE_STATE:
