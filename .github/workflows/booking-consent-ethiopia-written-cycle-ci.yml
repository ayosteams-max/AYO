name: Ethiopia Written Decision Cycle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construction-only:
    runs-on: ubuntu-latest
    env:
      ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT: CONSTRUCTION_ONLY_LOCAL
      ETHIOPIA_WRITTEN_CYCLE_CAPTURE_STATE: CONSTRUCTION_ONLY_LOCAL
      ETHIOPIA_WRITTEN_CYCLE_SELECTOR_CHECKPOINT: EXTERNAL_IMMUTABLE_ADMISSION_SUPPORT_INSTALLED_TRANSITION_PENDING
      ETHIOPIA_WRITTEN_CYCLE_VERIFIER_CHECKPOINT: DETERMINISTIC_SKELETON_SOURCE_AUTHORITY_RETAINED_COMPLETE_AGGREGATION_PENDING
    steps:
      - name: Reject incomplete Ethiopia companion construction
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT" == "CONSTRUCTION_ONLY_LOCAL" ]]
          [[ "$ETHIOPIA_WRITTEN_CYCLE_CAPTURE_STATE" == "CONSTRUCTION_ONLY_LOCAL" ]]
          [[ "$ETHIOPIA_WRITTEN_CYCLE_VERIFIER_CHECKPOINT" == "VERIFIER_INSTALLED_STRUCTURAL_VALIDATION_PENDING" ]]
          echo "Ethiopia written decision cycle companion is incomplete and prohibited from execution" >&2
          exit 1

      - name: Checkout governed candidate
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Set up governed Python runtime
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install pinned uv for Ethiopia written decision cycle
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        run: python -m pip install "uv==0.11.28"

      - name: Install locked Ethiopia written decision cycle dependencies
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        run: uv sync --locked --all-groups

      - name: Resolve trusted comparison base
        id: trusted_comparison_base
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_BASE_REF: ${{ github.base_ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          fixed=a62c3394111c14d93f787b7b319faa0a9b13293d
          zero=0000000000000000000000000000000000000000
          feature_ref=refs/heads/agent/booking-consent-ethiopia-written-decision-pack
          main_ref=refs/heads/main

          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_BASE_REF" == main && "$PR_BASE_SHA" == "$fixed" ]] || {
                echo "Ethiopia companion pull-request base authority rejected" >&2
                exit 1
              }
              authority="$PR_BASE_SHA"
              ;;
            push)
              case "$EVENT_REF" in
                "$main_ref") authority="$fixed" ;;
                "$feature_ref")
                  if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" == "$zero" ]]; then
                    authority="$fixed"
                  else
                    authority="$EVENT_BEFORE"
                  fi
                  ;;
                *)
                  echo "Ethiopia companion push ref authority rejected" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Ethiopia companion comparison event rejected" >&2
              exit 1
              ;;
          esac

          [[ "$authority" =~ ^[0-9a-f]{40}$ && "$authority" != "$zero" ]] || {
            echo "Ethiopia companion comparison SHA rejected" >&2
            exit 1
          }
          git cat-file -e "$authority^{commit}" 2>/dev/null || {
            echo "Ethiopia companion comparison commit unavailable" >&2
            exit 1
          }
          printf 'sha=%s\n' "$authority" >> "$GITHUB_OUTPUT"

      - name: Select exact governed evidence contract
        id: select_governed_evidence_contract
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESERVED_OUTPUT_NAME: mode
        run: |
          set -euo pipefail
          fixed=a62c3394111c14d93f787b7b319faa0a9b13293d
          zero=0000000000000000000000000000000000000000
          backend_blob=b51606faa0652651b62f1c180abf6fe339a9c121
          manifest_fingerprint=4aad460f97e00fc81773cbc573f678d644f0167ec87665475992baf1672e9d5e

          [[ "$RESERVED_OUTPUT_NAME" == mode ]] || {
            echo "Ethiopia companion selector output authority rejected" >&2
            exit 1
          }
          case "$EVENT_NAME" in
            workflow_dispatch)
              echo "Ethiopia companion workflow_dispatch rejected" >&2
              exit 1
              ;;
            pull_request)
              candidate="$PR_HEAD_SHA"
              [[ "$EVENT_CANDIDATE_SHA" == "$candidate" ]] || {
                echo "Ethiopia companion PR candidate identity rejected" >&2
                exit 1
              }
              ;;
            push)
              candidate="$RUNTIME_SHA"
              [[ "$EVENT_CANDIDATE_SHA" == "$candidate" ]] || {
                echo "Ethiopia companion push candidate identity rejected" >&2
                exit 1
              }
              ;;
            *)
              echo "Ethiopia companion selector event rejected" >&2
              exit 1
              ;;
          esac
          [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$zero" ]] || {
            echo "Ethiopia companion candidate SHA rejected" >&2
            exit 1
          }
          git cat-file -e "$candidate^{commit}" 2>/dev/null || {
            echo "Ethiopia companion candidate commit unavailable" >&2
            exit 1
          }
          git cat-file -e "$fixed^{commit}" 2>/dev/null || {
            echo "Ethiopia companion governed base unavailable" >&2
            exit 1
          }
          git merge-base --is-ancestor "$fixed" "$candidate" || {
            echo "Ethiopia companion governed ancestry rejected" >&2
            exit 1
          }
          [[ "$(git merge-base "$fixed" "$candidate")" == "$fixed" ]] || {
            echo "Ethiopia companion governed merge base rejected" >&2
            exit 1
          }

          expected=(
            .github/workflows/booking-consent-ethiopia-written-cycle-ci.yml
            .github/workflows/ci.yml
            docs/AYO_BOOKING_CONSENT_ETHIOPIA_COUNSEL_QUESTION_PACK_TEMPLATE.md
            docs/AYO_BOOKING_CONSENT_ETHIOPIA_WRITTEN_DECISION_CYCLE_ARCHITECTURE.md
            docs/AYO_DECISION_LOG.md
            docs/AYO_ROADMAP.md
          )
          mapfile -t changed < <(git diff --name-only --no-renames "$fixed" "$candidate")
          [[ "${#changed[@]}" -eq 6 && "${changed[*]}" == "${expected[*]}" ]] || {
            echo "Ethiopia companion six-path manifest rejected" >&2
            exit 1
          }
          mapfile -t statuses < <(git diff --name-status --no-renames "$fixed" "$candidate")
          [[ "${#statuses[@]}" -eq 6 ]] || {
            echo "Ethiopia companion manifest status count rejected" >&2
            exit 1
          }
          for index in "${!statuses[@]}"; do
            read -r status path extra <<<"${statuses[$index]}"
            [[ -z "${extra:-}" && "$path" == "${expected[$index]}" && "$status" != D ]] || {
              echo "Ethiopia companion manifest status rejected" >&2
              exit 1
            }
          done
          fingerprint="$(printf '%s\n' "${changed[@]}" | sha256sum | awk '{print $1}')"
          [[ "$fingerprint" == "$manifest_fingerprint" ]] || {
            echo "Ethiopia companion manifest fingerprint rejected" >&2
            exit 1
          }

          require_object() {
            local path="$1" expected_mode="$2" expected_type="$3" expected_object="$4"
            local entry mode type object listed_path
            entry="$(git ls-tree "$candidate" -- "$path")"
            [[ -n "$entry" && "$(git ls-tree "$candidate" -- "$path" | wc -l | tr -d ' ')" == 1 ]] || return 1
            read -r mode type object listed_path <<<"$entry"
            [[ "$mode" == "$expected_mode" && "$type" == "$expected_type" \
              && "$listed_path" == "$path" ]] || return 1
            [[ -z "$expected_object" || "$object" == "$expected_object" ]] || return 1
            git cat-file -e "$object^{$expected_type}" 2>/dev/null
          }

          require_object .github/workflows/booking-consent-ethiopia-written-cycle-ci.yml 100644 blob "" || {
            echo "Ethiopia companion workflow object rejected" >&2; exit 1; }
          require_object .github/workflows/ci.yml 100644 blob "$backend_blob" || {
            echo "Ethiopia Backend workflow construction object rejected" >&2; exit 1; }
          require_object docs/AYO_BOOKING_CONSENT_ETHIOPIA_COUNSEL_QUESTION_PACK_TEMPLATE.md 100644 blob 9f5b0a48d55d9c9acabb6182abc8c92f93675351 || exit 1
          require_object docs/AYO_BOOKING_CONSENT_ETHIOPIA_WRITTEN_DECISION_CYCLE_ARCHITECTURE.md 100644 blob d17523c571c13474d961f4ac79a1b67785b42edb || exit 1
          require_object docs/AYO_DECISION_LOG.md 100644 blob 16cd598d4f6a2060855c68f2c9cce327861b64ee || exit 1
          require_object docs/AYO_ROADMAP.md 100644 blob 43301996e1d6f867fd25dc9366c1c1a815859447 || exit 1

          require_object tests 040000 tree 2dbcb487bd27578a95d0db9a31c21ecde7032114 || exit 1
          require_object AYO-Mobile 040000 tree da39714a911ffbf02171d28348c88a39eab2d938 || exit 1
          require_object AYO-Mobile/tests 040000 tree d7143a733cf14e70851406dab8131ce7c69dd364 || exit 1
          require_object BACKEND 040000 tree 62500035ef60d94ccc6333f25cb3aa79ff5c3f21 || exit 1
          require_object database/migrations 040000 tree 253ecedebe58c31077a0baa7d2532adc46464f70 || exit 1
          require_object AYO-Mobile/package.json 100644 blob b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2 || exit 1
          require_object AYO-Mobile/package-lock.json 100644 blob ace7192e4a749f61a011f8e4293ccd1e053d648a || exit 1
          require_object pyproject.toml 100644 blob 6b8425f6ed81258388c4e6bba39c80af0afa7fef || exit 1
          require_object uv.lock 100644 blob 6a08d31b721b486950fd06df0ca3430fcbe8aabf || exit 1
          require_object .secrets.baseline 100644 blob 71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02 || exit 1
          require_object alembic.ini 100644 blob a2353502812251c10e36f8cd534de71c1dcca58b || exit 1
          require_object .python-version 100644 blob ebe773d9eeab42ab1f896401f5b9c581f88d6709 || exit 1
          require_object docs/AYO_BOOKING_CONSENT_APPROVAL_PACK_ARCHITECTURE.md 100644 blob a2285429b91f73de067807ababb0780a088d5e7a || exit 1
          require_object docs/AYO_BOOKING_CONSENT_APPROVAL_PACK_TEMPLATE.md 100644 blob 5d7218a9bd2ecc5d4561fe6164a6864e50cadb16 || exit 1
          require_object docs/AYO_BOOKING_CONSENT_DOCUMENT_DELIVERY_CONTRACT_ARCHITECTURE.md 100644 blob 54d69775049d6f0af12fe6ace2bfc5a8cf66ad81 || exit 1

          [[ "$ETHIOPIA_WRITTEN_CYCLE_SELECTOR_CHECKPOINT" == EXTERNAL_IMMUTABLE_ADMISSION_SUPPORT_INSTALLED_TRANSITION_PENDING ]] || {
            echo "Ethiopia companion selector checkpoint rejected" >&2
            exit 1
          }
          execution_sha="$candidate"
          admission_path=.github/ayo-admissions/booking-consent-ethiopia-written-decision-cycle-v2.admission
          if git cat-file -e "$execution_sha:$admission_path" 2>/dev/null; then
            mapfile -t admission_parents < <(git show -s --format='%P' "$execution_sha" | tr ' ' '\n')
            [[ "${#admission_parents[@]}" -eq 1 ]] || {
              echo "Ethiopia companion admission execution parent rejected" >&2; exit 1; }
            evidence_target_sha="${admission_parents[0]}"
          else
            evidence_target_sha="$execution_sha"
          fi
          git cat-file -e "$execution_sha^{commit}"
          git cat-file -e "$evidence_target_sha^{commit}"
          printf 'mode=%s\n' booking-consent-ethiopia-written-decision-cycle-architecture >> "$GITHUB_OUTPUT"
          printf 'execution_sha=%s\n' "$execution_sha" >> "$GITHUB_OUTPUT"
          printf 'evidence_target_sha=%s\n' "$evidence_target_sha" >> "$GITHUB_OUTPUT"

      - name: Preflight Ethiopia written decision cycle architecture authority before tooling
        id: ethiopia_written_cycle_preflight_topology
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.base_ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TRUSTED_COMPARISON_BASE_SHA: ${{ steps.trusted_comparison_base.outputs.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          fixed=a62c3394111c14d93f787b7b319faa0a9b13293d
          published_predecessor=9b9f5d035741f270fede11842254e71c2885221c
          feature_ref=refs/heads/agent/booking-consent-ethiopia-written-decision-pack
          main_ref=refs/heads/main
          refresh_authorized_feature() {
            local destination=refs/remotes/origin/ethiopia-written-cycle-feature
            git update-ref -d "$destination"
            git fetch --force --no-tags origin \
              "+refs/heads/agent/booking-consent-ethiopia-written-decision-pack:$destination"
            authorized_feature="$(git rev-parse "$destination")"
            [[ "$authorized_feature" =~ ^[0-9a-f]{40}$ && "$authorized_feature" != "$zero" ]] || {
              echo "Ethiopia written-cycle fetched feature identity malformed" >&2; exit 1; }
            git cat-file -e "$authorized_feature^{commit}" 2>/dev/null || {
              echo "Ethiopia written-cycle fetched feature commit unavailable" >&2; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_BASE_REF" == main && "$PR_BASE_SHA" == "$fixed" \
                && "$TRUSTED_COMPARISON_BASE_SHA" == "$fixed" \
                && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" != "$zero" ]] || {
                echo "Ethiopia written-cycle PR identity drift" >&2; exit 1; }
              candidate="$PR_HEAD_SHA"
              [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_HEAD_SHA" != "$zero" \
                && "$candidate" != "$EVENT_HEAD_SHA" ]] || {
                echo "Ethiopia written-cycle synthetic merge used as candidate" >&2; exit 1; }
              git cat-file -e "$candidate^{commit}" 2>/dev/null || {
                echo "Ethiopia written-cycle PR candidate unavailable" >&2; exit 1; }
              git cat-file -e "$EVENT_HEAD_SHA^{commit}" 2>/dev/null || {
                echo "Ethiopia written-cycle synthetic merge unavailable" >&2; exit 1; }
              git merge-base --is-ancestor "$fixed" "$candidate"
              git merge-base --is-ancestor "$fixed" "$EVENT_HEAD_SHA"
              git merge-base --is-ancestor "$candidate" "$EVENT_HEAD_SHA"
              ;;
            push)
              candidate="$EVENT_HEAD_SHA"
              [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$zero" ]] || {
                echo "Ethiopia written-cycle push candidate drift" >&2; exit 1; }
              [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && "$EVENT_BEFORE" != "$zero" ]] || {
                echo "Ethiopia written-cycle all-zero or malformed predecessor rejected" >&2; exit 1; }
              git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null || {
                echo "Ethiopia written-cycle predecessor unavailable" >&2; exit 1; }
              mapfile -t parents < <(git show -s --format='%P' "$candidate" | tr ' ' '\n')
              git merge-base --is-ancestor "$EVENT_BEFORE" "$candidate"
              if [[ "$EVENT_REF" == "$feature_ref" ]]; then
                [[ "$candidate" != "$published_predecessor" \
                  && "$TRUSTED_COMPARISON_BASE_SHA" == "$EVENT_BEFORE" \
                  && "${#parents[@]}" -eq 1 && "${parents[0]}" == "$EVENT_BEFORE" ]] || {
                  echo "Ethiopia written-cycle later feature push topology drift" >&2; exit 1; }
              elif [[ "$EVENT_REF" == "$main_ref" ]]; then
                [[ "$TRUSTED_COMPARISON_BASE_SHA" == "$fixed" \
                  && "$EVENT_BEFORE" == "$fixed" && "${#parents[@]}" -eq 2 \
                  && "${parents[0]}" == "$fixed" ]] || {
                  echo "Ethiopia written-cycle regular merge topology drift" >&2; exit 1; }
                refresh_authorized_feature
                [[ "${parents[1]}" == "$authorized_feature" ]] || {
                  echo "Ethiopia written-cycle merge second parent drift" >&2; exit 1; }
                git merge-base --is-ancestor "$fixed" "$authorized_feature"
                [[ "$(git rev-parse "$candidate^{tree}")" == "$(git rev-parse "$authorized_feature^{tree}")" ]] || {
                  echo "Ethiopia written-cycle merge tree drift" >&2; exit 1; }
              else
                echo "Ethiopia written-cycle push ref is not authorized" >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              echo "Ethiopia written decision cycle architecture rejects workflow_dispatch" >&2
              exit 1
              ;;
            *) echo "Unsupported Ethiopia written-cycle event" >&2; exit 1 ;;
          esac
          git cat-file -e "$fixed^{commit}"
          git cat-file -e "$candidate^{commit}"
          git merge-base --is-ancestor "$fixed" "$candidate"
          [[ "$(git merge-base "$fixed" "$candidate")" == "$fixed" ]]
          mapfile -t changed < <(git diff --name-only --no-renames "$fixed" "$candidate")
          expected=(
            .github/workflows/booking-consent-ethiopia-written-cycle-ci.yml
            .github/workflows/ci.yml
            docs/AYO_BOOKING_CONSENT_ETHIOPIA_COUNSEL_QUESTION_PACK_TEMPLATE.md
            docs/AYO_BOOKING_CONSENT_ETHIOPIA_WRITTEN_DECISION_CYCLE_ARCHITECTURE.md
            docs/AYO_DECISION_LOG.md
            docs/AYO_ROADMAP.md
          )
          [[ "${#changed[@]}" -eq 6 && "${changed[*]}" == "${expected[*]}" ]] || {
            echo "Ethiopia written-cycle exact six-path manifest drift" >&2; exit 1; }
          fingerprint="$(printf '%s\n' "${changed[@]}" | sha256sum | awk '{print $1}')"
          [[ "$fingerprint" == 4aad460f97e00fc81773cbc573f678d644f0167ec87665475992baf1672e9d5e ]] || {
            echo "Ethiopia written-cycle manifest fingerprint drift" >&2; exit 1; }
          [[ "$(git rev-parse "$candidate:tests")" == 2dbcb487bd27578a95d0db9a31c21ecde7032114 \
            && "$(git rev-parse "$candidate:AYO-Mobile")" == da39714a911ffbf02171d28348c88a39eab2d938 \
            && "$(git rev-parse "$candidate:AYO-Mobile/tests")" == d7143a733cf14e70851406dab8131ce7c69dd364 \
            && "$(git rev-parse "$candidate:BACKEND")" == 62500035ef60d94ccc6333f25cb3aa79ff5c3f21 \
            && "$(git rev-parse "$candidate:database/migrations")" == 253ecedebe58c31077a0baa7d2532adc46464f70 \
            && "$(git rev-parse "$candidate:AYO-Mobile/package.json")" == b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2 \
            && "$(git rev-parse "$candidate:AYO-Mobile/package-lock.json")" == ace7192e4a749f61a011f8e4293ccd1e053d648a \
            && "$(git rev-parse "$candidate:pyproject.toml")" == 6b8425f6ed81258388c4e6bba39c80af0afa7fef \
            && "$(git rev-parse "$candidate:uv.lock")" == 6a08d31b721b486950fd06df0ca3430fcbe8aabf \
            && "$(git rev-parse "$candidate:.secrets.baseline")" == 71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02 \
            && "$(git rev-parse "$candidate:alembic.ini")" == a2353502812251c10e36f8cd534de71c1dcca58b \
            && "$(git rev-parse "$candidate:.python-version")" == ebe773d9eeab42ab1f896401f5b9c581f88d6709 ]] || {
            echo "Ethiopia written-cycle immutable identity drift" >&2; exit 1; }
          git diff --quiet "$fixed" "$candidate" -- BACKEND tests database AYO-Mobile \
            pyproject.toml uv.lock alembic.ini .python-version .secrets.baseline || {
            echo "Ethiopia written-cycle executable dependency configuration drift" >&2; exit 1; }
          echo "Ethiopia written decision cycle architecture authority before tooling: PASS"

      - name: Bind exact Ethiopia written decision cycle architecture candidate identity
        id: ethiopia_written_cycle_candidate_identity
        if: ${{ env.ETHIOPIA_WRITTEN_CYCLE_COMPANION_CHECKPOINT != 'CONSTRUCTION_ONLY_LOCAL' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.base_ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TRUSTED_COMPARISON_BASE_SHA: ${{ steps.trusted_comparison_base.outputs.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          fixed=a62c3394111c14d93f787b7b319faa0a9b13293d
          published_predecessor=9b9f5d035741f270fede11842254e71c2885221c
          feature_ref=refs/heads/agent/booking-consent-ethiopia-written-decision-pack
          main_ref=refs/heads/main
          refresh_authorized_feature() {
            local destination=refs/remotes/origin/ethiopia-written-cycle-feature
            git update-ref -d "$destination"
            git fetch --force --no-tags origin \
              "+refs/heads/agent/booking-consent-ethiopia-written-decision-pack:$destination"
            authorized_feature="$(git rev-parse "$destination")"
            [[ "$authorized_feature" =~ ^[0-9a-f]{40}$ && "$authorized_feature" != "$zero" ]] || {
              echo "Ethiopia written-cycle fetched feature identity malformed" >&2; exit 1; }
            git cat-file -e "$authorized_feature^{commit}" 2>/dev/null || {
              echo "Ethiopia written-cycle fetched feature commit unavailable" >&2; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request)
              candidate="$PR_HEAD_SHA"
              [[ "$PR_BASE_REF" == main && "$PR_BASE_SHA" == "$fixed" \
                && "$TRUSTED_COMPARISON_BASE_SHA" == "$fixed" ]]
              [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$zero" \
                && "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_HEAD_SHA" != "$zero" \
                && "$candidate" != "$EVENT_HEAD_SHA" ]]
              git cat-file -e "$candidate^{commit}"
              git cat-file -e "$EVENT_HEAD_SHA^{commit}"
              git merge-base --is-ancestor "$fixed" "$candidate"
              git merge-base --is-ancestor "$fixed" "$EVENT_HEAD_SHA"
              git merge-base --is-ancestor "$candidate" "$EVENT_HEAD_SHA"
              ;;
            push)
              candidate="$EVENT_HEAD_SHA"
              [[ "$candidate" =~ ^[0-9a-f]{40}$ && "$candidate" != "$zero" ]]
              [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && "$EVENT_BEFORE" != "$zero" ]] || {
                echo "Ethiopia written-cycle exact identity rejects first publication" >&2; exit 1; }
              git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null || {
                echo "Ethiopia written-cycle exact identity predecessor unavailable" >&2; exit 1; }
              mapfile -t parents < <(git show -s --format='%P' "$candidate" | tr ' ' '\n')
              git merge-base --is-ancestor "$EVENT_BEFORE" "$candidate"
              if [[ "$EVENT_REF" == "$feature_ref" ]]; then
                [[ "$candidate" != "$published_predecessor" \
                  && "$TRUSTED_COMPARISON_BASE_SHA" == "$EVENT_BEFORE" \
