            AYO-Mobile/domain/booking-contracts.ts AYO-Mobile/domain/booking-intent.ts
            AYO-Mobile/localization/booking-intent.ts AYO-Mobile/services/booking-api.ts
            AYO-Mobile/services/booking-intent-controller.ts AYO-Mobile/services/booking-intent-store.ts
            AYO-Mobile/tests/booking-api.test.ts AYO-Mobile/tests/booking-contracts.test.ts
            AYO-Mobile/tests/booking-intent-controller.test.ts AYO-Mobile/tests/booking-intent-provider.test.tsx
            AYO-Mobile/tests/booking-localization.test.ts docs/AYO_DECISION_LOG.md
            docs/AYO_MOBILE_BOOKING_INTENT_FOUNDATION_ARCHITECTURE.md docs/AYO_ROADMAP.md
          )
          mapfile -t changed < <(git diff --name-only "$base" "$candidate")
          [[ "${changed[*]}" == "${expected[*]}" ]] || { echo "Mobile pre-tooling manifest drift" >&2; exit 1; }
          [[ "$(git rev-parse "$candidate:tests")" == 2dbcb487bd27578a95d0db9a31c21ecde7032114 \
            && "$(git rev-parse "$candidate:AYO-Mobile/tests")" == d7143a733cf14e70851406dab8131ce7c69dd364 \
            && "$(git rev-parse "$candidate:AYO-Mobile")" == da39714a911ffbf02171d28348c88a39eab2d938 \
            && "$(git rev-parse "$candidate:BACKEND")" == 62500035ef60d94ccc6333f25cb3aa79ff5c3f21 \
            && "$(git rev-parse "$candidate:database/migrations")" == 253ecedebe58c31077a0baa7d2532adc46464f70 \
            && "$(git rev-parse "$candidate:AYO-Mobile/package.json")" == b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2 \
            && "$(git rev-parse "$candidate:AYO-Mobile/package-lock.json")" == ace7192e4a749f61a011f8e4293ccd1e053d648a ]] || {
            echo "Mobile pre-tooling immutable identity drift" >&2; exit 1; }
          git diff --quiet "$base" "$candidate" -- BACKEND database/migrations tests \
            AYO-Mobile/package.json AYO-Mobile/package-lock.json AYO-Mobile/app AYO-Mobile/app.json \
            AYO-Mobile/eslint.config.js AYO-Mobile/tsconfig.json .secrets.baseline || {
