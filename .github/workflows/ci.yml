          AYO_DATABASE_SSL_MODE: disable
          PYTHONPATH: .
        run: |
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import time

          import psycopg
          from alembic import command
          from sqlalchemy import text

          from BACKEND.persistence.config import DatabaseSettings
          from BACKEND.persistence.engine import create_postgres_engine
          from BACKEND.persistence.migrations import (
              MIGRATION_LOCK_ID,
              MigrationRunner,
              SchemaVersionReadinessChecker,
              alembic_config,
          )

          admin = dict(host="127.0.0.1", user="ayo_test", password="ayo_test_password")
          with psycopg.connect(dbname="postgres", autocommit=True, **admin) as connection:
              connection.execute("DROP DATABASE IF EXISTS ayo_roundtrip")
              connection.execute("CREATE DATABASE ayo_roundtrip")
          with psycopg.connect(dbname="ayo_roundtrip", autocommit=True, **admin) as connection:
              connection.execute("CREATE EXTENSION postgis")
              if connection.execute(
                  "SELECT 1 FROM pg_roles WHERE rolname = 'ayo_runtime'"
              ).fetchone() is None:
                  connection.execute("CREATE ROLE ayo_runtime NOLOGIN")

          engine = create_postgres_engine(
              DatabaseSettings(application_name="ayo-ci-migration-roundtrip")
          )
          runner = MigrationRunner(engine)

          def downgrade_with_migration_lock(revision):
              with engine.connect() as connection:
                  deadline = time.monotonic() + 30.0
                  locked = False
                  try:
                      while time.monotonic() < deadline:
                          locked = bool(
                              connection.execute(
                                  text("SELECT pg_try_advisory_lock(:lock_id)"),
                                  {"lock_id": MIGRATION_LOCK_ID},
                              ).scalar_one()
                          )
                          connection.commit()
                          if locked:
                              break
                          time.sleep(0.1)
                      if not locked:
                          raise SystemExit(
                              "Timed out waiting for the governed migration lock"
                          )
                      config = alembic_config()
                      config.attributes["connection"] = connection
                      command.downgrade(config, revision)
                  finally:
                      if locked:
                          connection.execute(
                              text("SELECT pg_advisory_unlock(:lock_id)"),
                              {"lock_id": MIGRATION_LOCK_ID},
                          )
                          connection.commit()

          def revision_and_fingerprint():
              with engine.connect() as connection:
                  revision = connection.execute(
                      text("SELECT version_num FROM public.ayo_schema_version")
                  ).scalar_one()
                  rows = connection.execute(text("""
                      SELECT n.nspname, c.relname, c.relkind,
                             COALESCE(pg_get_constraintdef(k.oid, true), ''),
                             COALESCE(k.conname, '')
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      LEFT JOIN pg_constraint k ON k.conrelid = c.oid
                      WHERE n.nspname = 'ayo'
                      ORDER BY 1, 2, 3, 4, 5
                  """)).fetchall()
              payload = json.dumps(
                  [tuple(row) for row in rows], separators=(",", ":"), default=str
              )
              return revision, hashlib.sha256(payload.encode()).hexdigest()

          try:
              runner.upgrade("20260723_0054")
              revision_0054, fingerprint_0054 = revision_and_fingerprint()
              runner.upgrade("20260723_0055")
              revision_0055, fingerprint_0055 = revision_and_fingerprint()
              downgrade_with_migration_lock("20260723_0054")
              restored_0054, restored_fingerprint_0054 = revision_and_fingerprint()
              if (
                  revision_0054 != "20260723_0054"
                  or restored_0054 != "20260723_0054"
                  or restored_fingerprint_0054 != fingerprint_0054
              ):
                  raise SystemExit(
                      "Migration 0055 did not restore its exact predecessor schema"
                  )
              runner.upgrade("20260723_0055")
              reupgraded_0055, reupgraded_fingerprint_0055 = (
                  revision_and_fingerprint()
              )
              if (
                  revision_0055 != "20260723_0055"
                  or reupgraded_0055 != "20260723_0055"
                  or reupgraded_fingerprint_0055 != fingerprint_0055
              ):
                  raise SystemExit("Migration 0055 re-upgrade schema drift")

              runner.upgrade("20260724_0056")
              revision_0056, fingerprint_0056 = revision_and_fingerprint()
              downgrade_with_migration_lock("20260723_0055")
              restored_0055, restored_fingerprint_0055 = revision_and_fingerprint()
              if (
                  restored_0055 != "20260723_0055"
                  or restored_fingerprint_0055 != fingerprint_0055
              ):
                  raise SystemExit(
                      "Migration 0056 did not restore its exact predecessor schema"
                  )
              runner.upgrade("20260724_0056")
              final_revision, final_fingerprint = revision_and_fingerprint()
              if (
                  revision_0056 != "20260724_0056"
                  or final_revision != "20260724_0056"
                  or final_fingerprint != fingerprint_0056
              ):
                  raise SystemExit("Migration 0056 re-upgrade schema drift")

              readiness = SchemaVersionReadinessChecker(engine).check()
              if (
                  not readiness.ready
                  or readiness.current_revision != "20260724_0056"
                  or readiness.expected_revision != "20260724_0056"
              ):
                  raise SystemExit("Round-trip database is not at canonical readiness")
              print("Migration 0055 predecessor fingerprint:", fingerprint_0054)
              print(
                  "Migration 0055 restored predecessor fingerprint:",
                  restored_fingerprint_0054,
              )
              print("Migration 0056 predecessor fingerprint:", fingerprint_0055)
              print(
                  "Migration 0056 restored predecessor fingerprint:",
                  restored_fingerprint_0055,
              )
              print("Round-trip canonical head:", final_revision)
              print("Round-trip schema readiness: PASS")
              print("Migration 0055/0056 round trip: PASS")
          finally:
              engine.dispose()
              with psycopg.connect(
                  dbname="postgres", autocommit=True, **admin
              ) as connection:
                  connection.execute(
                      """
                      SELECT pg_terminate_backend(pid)
                      FROM pg_stat_activity
                      WHERE datname = 'ayo_roundtrip'
                        AND pid <> pg_backend_pid()
                      """
                  )
                  connection.execute("DROP DATABASE IF EXISTS ayo_roundtrip")
                  database_count = connection.execute(
                      "SELECT count(*) FROM pg_database WHERE datname = 'ayo_roundtrip'"
                  ).fetchone()[0]
                  connection_count = connection.execute(
                      "SELECT count(*) FROM pg_stat_activity WHERE datname = 'ayo_roundtrip'"
                  ).fetchone()[0]
                  role_dependencies = connection.execute(
                      """
                      SELECT count(*)
                      FROM pg_shdepend dependency
                      JOIN pg_roles role ON role.oid = dependency.refobjid
                      LEFT JOIN pg_database database ON database.oid = dependency.dbid
                      WHERE role.rolname = 'ayo_runtime'
                        AND database.datname = 'ayo_roundtrip'
                      """
                  ).fetchone()[0]
                  if database_count or connection_count or role_dependencies:
                      raise SystemExit(
                          "Round-trip database cleanup was incomplete: "
                          f"databases={database_count}, connections={connection_count}, "
                          f"role_dependencies={role_dependencies}"
                      )
                  print("Round-trip database absent after cleanup: PASS")
                  print("Round-trip active connections after cleanup: 0")
                  print("Round-trip ayo_runtime dependencies after cleanup: 0")
          PY

      - name: Verify Batch 1 typing evidence equivalence
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          mypy_root="$(mktemp -d)"
