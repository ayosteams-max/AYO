      - name: Capture Mobile Booking Node Jest TypeScript and lint evidence
        if: success() && steps.evidence_contract.outputs.mode == 'mobile-booking-intent-foundation'
        working-directory: AYO-Mobile
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/mobile-booking-evidence-sections
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          trap 'rm -f "$EVIDENCE_ROOT"/*.json "$EVIDENCE_ROOT"/*.log \
            "$EVIDENCE_ROOT"/*.tap "$EVIDENCE_ROOT"/*.tap.status "$EVIDENCE_ROOT"/*.log.status' EXIT
          run_capture() {
            local output="$1"; shift
            set +e
            "$@" >"$output" 2>&1
            local status=$?
            set -e
            printf '%s\n' "$status" >"$output.status"
          }
          run_capture "$EVIDENCE_ROOT/focused-node.tap" node --experimental-strip-types --test \
            --test-reporter=tap \
            tests/booking-api.test.ts tests/booking-contracts.test.ts \
            tests/booking-intent-controller.test.ts tests/booking-localization.test.ts
          run_capture "$EVIDENCE_ROOT/complete-node.tap" node --experimental-strip-types --test \
            --test-reporter=tap tests/*.test.ts
          run_capture "$EVIDENCE_ROOT/focused-jest.log" npm run test:provider -- \
            tests/booking-intent-provider.test.tsx --json \
            --outputFile="$EVIDENCE_ROOT/focused-jest.json"
          run_capture "$EVIDENCE_ROOT/complete-jest.log" npm run test:provider -- \
            --json --outputFile="$EVIDENCE_ROOT/complete-jest.json"
          run_capture "$EVIDENCE_ROOT/typescript.log" npm run typecheck
          run_capture "$EVIDENCE_ROOT/lint.log" npm run lint -- -- \
            --format json --output-file "$EVIDENCE_ROOT/lint.json"
          EVIDENCE_ROOT="$EVIDENCE_ROOT" python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          node_version = subprocess.run(["node", "--version"], check=True, capture_output=True, text=True).stdout.strip()
          if not re.fullmatch(r"v[0-9]+(?:\.[0-9]+){2}", node_version): raise SystemExit("Node version output drift")
          package_lock = json.loads(Path("package-lock.json").read_text())
          def digest(lines):
              return hashlib.sha256("\n".join(lines).encode()).hexdigest()
          def write(name, start, fields):
              lines = [start, *(f"{key}={value}" for key, value in fields), f"END_{start}"]
              path = root / name
              block = "\n".join(lines) + "\n"
              path.write_text(block, encoding="utf-8", newline="\n")
              if path.read_text(encoding="utf-8") != block: raise SystemExit("mobile evidence write drift")
          def status(name):
              value = (root / f"{name}.status").read_text().strip()
              if not re.fullmatch(r"[0-9]+", value): raise SystemExit("malformed command status")
              return int(value)
          def node(name, output_name, files):
              if status(name + ".tap"):
                  raise SystemExit(f"Node command failed: {name}")
              try:
                  with open(root / f"{name}.tap", encoding="utf-8", newline="") as source:
                      text = source.read()
              except (OSError, UnicodeError):
                  raise SystemExit(f"malformed Node TAP encoding: {name}") from None
              if "\r" in text:
                  raise SystemExit(f"malformed Node TAP encoding: {name}")
              header_count = len(re.findall(r"(?m)^TAP version 13$", text))
              top_level_plan_count = len(re.findall(r"(?m)^1\.\.(?:0|[1-9][0-9]*)$", text))
              if header_count != 1:
                  raise SystemExit(
                      f"Node TAP failure: stream={name} category=header_cardinality "
                      f"headers={header_count} top_level_plans={top_level_plan_count} status=zero"
                  )
              if not text.startswith("TAP version 13\n"):
                  raise SystemExit(
                      f"Node TAP failure: stream={name} category=document_prefix "
                      f"headers={header_count} top_level_plans={top_level_plan_count} status=zero"
                  )
              plans = re.findall(r"(?m)^1\.\.(0|[1-9][0-9]*)$", text)
              if len(plans) != 1:
                  raise SystemExit(f"malformed Node TAP plan: {name}")
              plan = int(plans[0])
              if plan <= 0:
                  raise SystemExit(f"empty Node TAP plan: {name}")
              summaries = {}
              for key in ("tests", "pass", "fail", "cancelled", "skipped", "todo"):
                  matches = re.findall(rf"(?m)^# {key} (0|[1-9][0-9]*)$", text)
                  if len(matches) != 1:
                      raise SystemExit(f"malformed Node TAP summary: {name} {key}")
                  summaries[key] = int(matches[0])
              subtests = re.findall(r"(?m)^( *)# Subtest: ([^\r\n]+)$", text)
              selected = [value for _, value in subtests]
              top_level = [value for indent, value in subtests if not indent]
              if any(len(indent) % 4 for indent, _ in subtests):
                  raise SystemExit(f"ambiguous Node TAP nesting: {name}")
              if len(top_level) != plan:
                  raise SystemExit(f"Node TAP plan drift: {name}")
              if len(selected) != summaries["tests"] or len(selected) != len(set(selected)):
                  raise SystemExit(f"Node selected inventory drift: {name}")
              passed = re.findall(r"(?m)^\s*ok \d+ - (.+?)(?: #.*)?$", text)
              if len(passed) != summaries["pass"] or len(passed) != len(set(passed)):
                  raise SystemExit(f"Node passing inventory drift: {name}")
              if any(summaries[key] for key in ("fail", "cancelled", "skipped", "todo")):
                  raise SystemExit(f"Node command did not pass exactly: {name}")
              if summaries["tests"] != sum(summaries[key] for key in ("pass", "fail", "cancelled", "skipped", "todo")):
                  raise SystemExit(f"Node arithmetic drift: {name}")
              plan_end = re.search(r"(?m)^1\.\.(?:0|[1-9][0-9]*)$", text).end()
              trailer = [line for line in text[plan_end:].splitlines() if line]
              trailer_keys = ("tests", "suites", "pass", "fail", "cancelled", "skipped", "todo")
              if (
                  len(trailer) != len(trailer_keys) + 1
                  or any(
                      not re.fullmatch(rf"# {key} (?:0|[1-9][0-9]*)", line)
                      for key, line in zip(trailer_keys, trailer[:-1], strict=True)
                  )
                  or not re.fullmatch(r"# duration_ms [0-9]+(?:\.[0-9]+)?", trailer[-1])
              ):
                  raise SystemExit(f"unknown Node TAP trailer: {name}")
              file_inventory = sorted(files)
              required_focused_files = [
                  "tests/booking-api.test.ts",
                  "tests/booking-contracts.test.ts",
                  "tests/booking-intent-controller.test.ts",
                  "tests/booking-localization.test.ts",
              ]
              if name == "focused-node" and file_inventory != required_focused_files:
                  raise SystemExit("focused Node file inventory drift")
              fields = [(key, summaries[key]) for key in ("tests", "pass", "fail", "cancelled", "skipped", "todo")]
              fields += [
                  ("test_file_count", len(file_inventory)),
                  ("test_file_fingerprint", digest(file_inventory)),
                  ("selected_test_fingerprint", digest(sorted(selected))),
                  ("passing_test_fingerprint", digest(sorted(passed))),
                  ("required_inventory", "PASS"),
                  ("process_exit", 0),
                  ("node_version", node_version),
                  ("command_fingerprint", digest([
                      "node --experimental-strip-types --test --test-reporter=tap"
                      if name == "focused-node" else
                      "node --experimental-strip-types --test --test-reporter=tap tests/*.test.ts",
                      *file_inventory,
                  ])),
              ]
              write(output_name, output_name.removesuffix(".txt"), fields)
          focused_files = [
              "tests/booking-api.test.ts", "tests/booking-contracts.test.ts",
              "tests/booking-intent-controller.test.ts", "tests/booking-localization.test.ts",
          ]
          complete_files = sorted(path.as_posix() for path in Path("tests").glob("*.test.ts"))
          node("focused-node", "MOBILE_FOCUSED_NODE_V1.txt", focused_files)
          node("complete-node", "MOBILE_COMPLETE_NODE_V1.txt", complete_files)
          def jest(name, output_name, focused=False):
              if status(name + ".log"): raise SystemExit(f"Jest command failed: {name}")
              value = json.loads((root / f"{name}.json").read_text(encoding="utf-8"))
              required = {"numTotalTestSuites", "numPassedTestSuites", "numFailedTestSuites", "numPendingTestSuites", "numTotalTests", "numPassedTests", "numFailedTests", "numPendingTests", "numTodoTests", "testResults"}
              if not required.issubset(value): raise SystemExit(f"malformed Jest result: {name}")
              suites = sorted(Path(item["name"]).relative_to(Path.cwd()).as_posix() for item in value["testResults"])
              tests = sorted(f"{Path(item['name']).relative_to(Path.cwd()).as_posix()}::{case['fullName']}" for item in value["testResults"] for case in item["assertionResults"])
              passing = sorted(f"{Path(item['name']).relative_to(Path.cwd()).as_posix()}::{case['fullName']}" for item in value["testResults"] for case in item["assertionResults"] if case["status"] == "passed")
              if len(suites) != len(set(suites)) or len(tests) != len(set(tests)): raise SystemExit("duplicate Jest inventory")
              if value["numFailedTestSuites"] or value["numPendingTestSuites"] or value["numFailedTests"] or value["numPendingTests"] or value["numTodoTests"]: raise SystemExit("unexpected Jest result")
              required_suite = "tests/booking-intent-provider.test.tsx"
              if focused and suites != [required_suite]: raise SystemExit("focused Booking provider suite drift")
              log = (root / f"{name}.log").read_text(encoding="utf-8", errors="replace")
              warning_categories = sorted(re.findall(r"(?m)^\s*console\.(warn|error)$", log))
              fields = [
                  ("suites_total", value["numTotalTestSuites"]), ("suites_passed", value["numPassedTestSuites"]),
                  ("suites_failed", value["numFailedTestSuites"]), ("suites_pending", value["numPendingTestSuites"]),
                  ("tests_total", value["numTotalTests"]), ("tests_passed", value["numPassedTests"]),
                  ("tests_failed", value["numFailedTests"]), ("tests_pending", value["numPendingTests"]),
                  ("tests_todo", value["numTodoTests"]), ("suite_fingerprint", digest(suites)),
                  ("selected_test_fingerprint", digest(tests)), ("passing_test_fingerprint", digest(passing)),
                  ("warning_category_count", len(warning_categories)), ("warning_category_fingerprint", digest(warning_categories)),
                  ("focused_booking_provider", "PASS" if focused else "NOT_APPLICABLE"),
                  ("process_exit", 0), ("jest_version", package_lock["packages"]["node_modules/jest"]["version"]),
                  ("command_fingerprint", digest([
                      "npm run test:provider -- tests/booking-intent-provider.test.tsx"
                      if focused else "npm run test:provider"
                  ])),
              ]
              write(output_name, output_name.removesuffix(".txt"), fields)
          jest("focused-jest", "MOBILE_FOCUSED_PROVIDER_JEST_V1.txt", True)
          jest("complete-jest", "MOBILE_COMPLETE_PROVIDER_JEST_V1.txt")
          if status("typescript.log"): raise SystemExit("TypeScript command failed")
          tsc_lines = [line for line in (root / "typescript.log").read_text(encoding="utf-8").splitlines() if line and not line.startswith(">")]
          diagnostic = [line for line in tsc_lines if re.search(r"\([0-9]+,[0-9]+\): error TS[0-9]+:", line)]
          if diagnostic or tsc_lines: raise SystemExit("unknown TypeScript output")
          write("MOBILE_TYPESCRIPT_V1.txt", "MOBILE_TYPESCRIPT_V1", [
              ("typescript_version", package_lock["packages"]["node_modules/typescript"]["version"]),
              ("diagnostic_count", len(diagnostic)), ("affected_file_count", 0),
              ("diagnostic_fingerprint", digest(diagnostic)), ("process_exit", 0),
              ("command_fingerprint", digest(["npm run typecheck"])),
          ])
          if status("lint.log"): raise SystemExit("mobile lint command failed")
          lint = json.loads((root / "lint.json").read_text(encoding="utf-8"))
          diagnostics = sorted(f"{Path(item['filePath']).relative_to(Path.cwd()).as_posix()}|{message['ruleId']}|{message['severity']}|{message['line']}|{message['column']}|{' '.join(message['message'].split())}" for item in lint for message in item["messages"])
          errors = sum(item["errorCount"] for item in lint); warnings = sum(item["warningCount"] for item in lint)
          if errors or warnings: raise SystemExit("mobile lint diagnostics are not clean")
          lock = package_lock
          write("MOBILE_LINT_V1.txt", "MOBILE_LINT_V1", [
              ("expo_version", lock["packages"]["node_modules/expo"]["version"]),
              ("eslint_version", lock["packages"]["node_modules/eslint"]["version"]),
              ("error_count", errors), ("warning_count", warnings),
              ("diagnostic_fingerprint", digest(diagnostics)), ("process_exit", 0),
              ("command_fingerprint", digest([
                  "npm run lint -- -- --format json --output-file $EVIDENCE_ROOT/lint.json"
              ])),
          ])
          for path in root.glob("*.json"): path.unlink()
          for path in root.glob("*.log"): path.unlink()
          for path in root.glob("*.tap*"): path.unlink()
          PY

      - name: Capture Mobile Booking npm dependency audit evidence
        if: success() && steps.evidence_contract.outputs.mode == 'mobile-booking-intent-foundation'
        working-directory: AYO-Mobile
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/mobile-booking-evidence-sections
        run: |
          set -euo pipefail
          npm --version >"$EVIDENCE_ROOT/npm-version.txt"
          trap 'rm -f "$EVIDENCE_ROOT"/npm-version.txt "$EVIDENCE_ROOT"/npm-audit-all.json \
            "$EVIDENCE_ROOT"/npm-audit-production.json "$EVIDENCE_ROOT"/npm-audit-all.err \
            "$EVIDENCE_ROOT"/npm-audit-production.err' EXIT
          set +e
          npm audit --json >"$EVIDENCE_ROOT/npm-audit-all.json" 2>"$EVIDENCE_ROOT/npm-audit-all.err"
          all_status=$?
          npm audit --omit=dev --json >"$EVIDENCE_ROOT/npm-audit-production.json" 2>"$EVIDENCE_ROOT/npm-audit-production.err"
          production_status=$?
          set -e
          ALL_STATUS="$all_status" PRODUCTION_STATUS="$production_status" EVIDENCE_ROOT="$EVIDENCE_ROOT" python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          def load(name, status):
              if status not in (0, 1): raise SystemExit("npm audit infrastructure status drift")
              value = json.loads((root / name).read_text(encoding="utf-8"))
              if value.get("error") or not isinstance(value.get("metadata"), dict): raise SystemExit("npm audit incomplete")
              vulnerabilities = value["metadata"].get("vulnerabilities")
              dependencies = value["metadata"].get("dependencies")
              if not isinstance(vulnerabilities, dict) or not isinstance(dependencies, dict): raise SystemExit("npm audit metadata malformed")
              severities = ["info", "low", "moderate", "high", "critical", "total"]
              if any(type(vulnerabilities.get(key)) is not int or vulnerabilities[key] < 0 for key in severities): raise SystemExit("npm audit vulnerability counts malformed")
              dep_keys = sorted(key for key, item in dependencies.items() if type(item) is int and item >= 0)
              if not dep_keys: raise SystemExit("npm audit dependency population absent")
              dep_lines = [f"{key}={dependencies[key]}" for key in dep_keys]
              return vulnerabilities, dependencies, hashlib.sha256("\n".join(dep_lines).encode()).hexdigest()
          all_v, all_d, all_fp = load("npm-audit-all.json", int(os.environ["ALL_STATUS"]))
          prod_v, prod_d, prod_fp = load("npm-audit-production.json", int(os.environ["PRODUCTION_STATUS"]))
          npm_version = (root / "npm-version.txt").read_text().strip()
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){2}", npm_version): raise SystemExit("npm version output drift")
          lines = ["MOBILE_DEPENDENCY_AUDIT_V1", f"npm_version={npm_version}"]
          for prefix, values in (("all", all_v), ("production", prod_v)):
              lines.extend(f"{prefix}_{key}={values[key]}" for key in ("info", "low", "moderate", "high", "critical", "total"))
          for prefix, values in (("all", all_d), ("production", prod_d)):
              lines.extend(
                  f"{prefix}_dependency_{key}={values[key]}"
                  for key in sorted(values) if type(values[key]) is int and values[key] >= 0
              )
          lines += [f"all_dependency_population_fingerprint={all_fp}", f"production_dependency_population_fingerprint={prod_fp}", "audit_completion=PASS", "END_MOBILE_DEPENDENCY_AUDIT_V1"]
          block = "\n".join(lines) + "\n"; path = root / "MOBILE_DEPENDENCY_AUDIT_V1.txt"
          path.write_text(block, encoding="utf-8", newline="\n")
          if path.read_text(encoding="utf-8") != block: raise SystemExit("npm audit evidence retention failed")
          for name in ("npm-version.txt", "npm-audit-all.json", "npm-audit-production.json", "npm-audit-all.err", "npm-audit-production.err"): (root / name).unlink(missing_ok=True)
          PY

      - name: Verify Mobile Booking preview-only source safety
