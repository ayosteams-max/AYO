          def normalized(path, *, allow_empty=False):
              roots = {
                  os.environ["SOURCE_DIR"].replace("\\", "/").rstrip("/") + "/",
                  str(Path.cwd()).replace("\\", "/").rstrip("/") + "/",
              }
              diagnostics = []
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw.replace("\\", "/")
                  for root in roots:
                      if line.startswith(root):
                          line = line[len(root):]
                          break
                  match = pattern.fullmatch(line)
                  if match:
                      diagnostics.append(
                          Diagnostic(
                              match["path"],
                              int(match["line"]),
                              int(match["column"]),
                              match["code"],
                              " ".join(match["message"].split()),
