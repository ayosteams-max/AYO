          if not provider_props or re.search(r"(?:controller|continuity|store|state)\s*[?:]", provider_props):
              raise SystemExit("Mobile Booking provider exposes authority injection")
          candidate = os.environ.get("TESTED_COMMIT_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("Mobile source-safety candidate identity drift")
          changed = set(subprocess.run(
              ["git", "diff", "--name-only", "ee6650d7f6304e73c31aee8a1ab709cd3be1fbf0", candidate],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines())
          if any(path.startswith("AYO-Mobile/app/") or path in {
              "AYO-Mobile/app.json", "AYO-Mobile/package.json", "AYO-Mobile/package-lock.json"
          } for path in changed):
              raise SystemExit("Mobile Booking screen navigation or configuration drift")
          fields = [
              "confirmation_recovery_authority=ABSENT", "capability_unlock=ABSENT",
              "provider_composition_wiring=ABSENT", "context_authority_injection=ABSENT",
              "caller_selected_identity=ABSENT", "durable_storage=ABSENT",
              "sensitive_logging=ABSENT", "external_activation=ABSENT",
              "screen_navigation_change=ABSENT", "production_activation=ABSENT",
              "unsafe_authority_suppression=ABSENT", "mobile_changed_line_coverage=NOT_AVAILABLE_COMMITTED_TOOLING",
              "complete_check_execution=COMPONENT_COMMANDS_EXECUTED_WITHOUT_DOUBLE_COUNTING",
              "complete_check_script_fingerprint=" + hashlib.sha256(
                  json.loads(Path("AYO-Mobile/package.json").read_text(encoding="utf-8"))["scripts"]["check"].encode()
              ).hexdigest(),
          ]
          block = "MOBILE_SOURCE_SAFETY_V1\n" + "\n".join(fields) + "\nEND_MOBILE_SOURCE_SAFETY_V1\n"
          path = Path(os.environ["EVIDENCE_PATH"]); path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("x", encoding="utf-8", newline="\n") as output:
              output.write(block); output.flush(); os.fsync(output.fileno())
          if path.read_text(encoding="utf-8") != block:
