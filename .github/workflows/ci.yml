                  "SELECT 1 FROM pg_roles WHERE rolname = 'ayo_runtime'"
              ).fetchone():
                  connection.execute("DROP OWNED BY ayo_runtime")
          with psycopg.connect(dbname="postgres", **connection_args) as connection:
              connection.execute("DROP ROLE IF EXISTS ayo_runtime")
              databases = connection.execute(
                  "SELECT datname FROM pg_database WHERE datname = ANY(%s)",
                  (list(disposable_databases),),
              ).fetchall()
              connections = connection.execute(
                  "SELECT datname, usename FROM pg_stat_activity "
                  "WHERE datname = ANY(%s) OR usename = 'ayo_runtime'",
                  (list(disposable_databases),),
              ).fetchall()
              role_count = connection.execute(
                  "SELECT count(*) FROM pg_roles WHERE rolname = 'ayo_runtime'"
              ).fetchone()[0]
          if databases or connections or role_count:
              raise SystemExit(
                  "Final PostgreSQL lifecycle cleanup failed: "
                  f"databases={databases!r} connections={connections!r} "
                  f"roles={role_count}"
              )
          print("Final disposable database count: 0")
          print("Final ayo_runtime connection count: 0")
          print("Final ayo_runtime role count: 0")
          PY

      - name: Verify certified candidate tree cleanliness
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git status --short --untracked-files=no
            echo "Certified candidate tracked tree is not clean" >&2
            exit 1
          fi
          echo "Certified candidate tracked tree cleanliness: PASS"
