          if workflow_only_admission:
              for subtree in ("BACKEND", "tests", "database/migrations"):
                  if git("rev-parse", f"{authoritative_base}:{subtree}") != git("rev-parse", f"{head}:{subtree}"):
                      raise SystemExit(f"workflow-only admission altered {subtree}")
              for path in ("pyproject.toml", "uv.lock", ".secrets.baseline"):
                  if git("rev-parse", f"{authoritative_base}:{path}") != git("rev-parse", f"{head}:{path}"):
                      raise SystemExit(f"workflow-only admission altered {path}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("content_classification=workflow-only-authority\n")
                  output.write(f"content_comparison_base_sha={authoritative_base}\n")
              print("Courier Pickup W16 content preserved by workflow-only admission")
              raise SystemExit(0)
          base = predecessor
          changed = git("diff", "--name-only", base, head).splitlines()
          if changed != expected_paths:
              raise SystemExit(f"Courier Pickup tested ten-path boundary drift: {changed!r}")
          fingerprint = hashlib.sha256("\n".join(changed).encode()).hexdigest()
          if fingerprint != expected["manifest"]:
              raise SystemExit(f"Courier Pickup tested manifest drift: {fingerprint}")
          for subtree, value in (("BACKEND", expected["backend"]), ("tests", expected["tests"])):
              if git("rev-parse", f"{head}:{subtree}") != value:
                  raise SystemExit(f"Courier Pickup tested {subtree} tree drift")
          migration = "database/migrations/versions/20260805_0057_courier_pickup_idempotency_replay.py"
          if git("rev-parse", f"{head}:{migration}") != expected["migration"]:
              raise SystemExit("Courier Pickup tested Migration 0057 blob drift")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("content_classification=reviewed-feature-content\n")
              output.write(f"content_comparison_base_sha={base}\n")
          print("Courier Pickup tested content is exactly bound to trusted base:", base)
          print("Courier Pickup tested ten-path manifest fingerprint:", fingerprint)
