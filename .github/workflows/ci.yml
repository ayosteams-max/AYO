                [[ "$EVENT_REF" == refs/heads/main && "$EVENT_BEFORE $a" == "$b $EVENT_HEAD_SHA" || "$EVENT_REF" != refs/heads/main && "$EVENT_BEFORE $a $(git merge-base "$EVENT_HEAD_SHA" "$a")" == "0bc9305b8acc448e297a308afc4e378e97169d01 $b $b" ]] || exit 1
                comparison_sha="$b"
                mode=verified-ap-registry-reconciliation-enablement-base
              elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "$zero" ]]; then
                require_commit "$EVENT_BEFORE" "push before SHA"
                git merge-base --is-ancestor "$EVENT_BEFORE" "$EVENT_HEAD_SHA" || {
                  echo "push before SHA is not an ancestor of the pushed head" >&2
                  exit 1
                }
                comparison_sha="$EVENT_BEFORE"
                mode=verified-push-before
              elif [[ "$EVIDENCE_MODE" == "booking-consent-policy-authority" \
                || "$EVIDENCE_MODE" == "mobile-booking-intent-foundation" \
                || "$EVIDENCE_MODE" == "booking-consent-document-delivery-architecture" \
                || "$EVIDENCE_MODE" == "booking-consent-approval-pack-architecture" ]]; then
                if [[ "$EVIDENCE_MODE" == "booking-consent-approval-pack-architecture" ]]; then
                  expected_base=6aa98a78953531b637413e54b3afa93c721ae863
                  label="Booking consent approval-pack architecture"
                  first_push_mode=verified-booking-consent-approval-pack-first-push-base
                elif [[ "$EVIDENCE_MODE" == "booking-consent-document-delivery-architecture" ]]; then
                  expected_base=cadaa30c47ccbb849bf428c14576298b26ee6323
                  label="Booking consent document delivery architecture"
                  first_push_mode=verified-consent-document-architecture-first-push-base
                elif [[ "$EVIDENCE_MODE" == "mobile-booking-intent-foundation" ]]; then
                  expected_base=ee6650d7f6304e73c31aee8a1ab709cd3be1fbf0
                  label="Mobile Booking intent foundation"
                  first_push_mode=verified-mobile-booking-intent-first-push-base
                else
                  expected_base=6613a936b0fe896308682c8fe038708876a06c02
                  label="Booking consent authority"
                  first_push_mode=verified-booking-consent-first-push-base
                fi
                git fetch --no-tags origin \
                  refs/heads/main:refs/remotes/origin/coverage-main
                authoritative_main="$(git rev-parse refs/remotes/origin/coverage-main)"
                require_commit "$authoritative_main" "authoritative remote main SHA"
                if [[ "$authoritative_main" != "$expected_base" ]]; then
                  echo "$label first-push remote main drift" >&2
                  exit 1
                fi
                merge_base="$(git merge-base "$EVENT_HEAD_SHA" "$authoritative_main")"
                if [[ "$merge_base" != "$expected_base" ]]; then
                  echo "$label first-push merge-base drift" >&2
                  exit 1
                fi
                git merge-base --is-ancestor "$expected_base" "$EVENT_HEAD_SHA" || {
                  echo "$label first-push base is not an ancestor" >&2
                  exit 1
                }
                comparison_sha="$expected_base"
                mode="$first_push_mode"
              else
                mapfile -t parents < <(git show -s --format='%P' "$EVENT_HEAD_SHA" | tr ' ' '\n')
                if [[ "${#parents[@]}" -ne 1 ]]; then
                  echo "first branch push must contain one unambiguous parent" >&2
                  exit 1
                fi
                first_parent="${parents[0]}"
                require_commit "$first_parent" "first-push parent SHA"
                git merge-base --is-ancestor "$first_parent" "$EVENT_HEAD_SHA" || {
                  echo "first-push parent is not an ancestor of the pushed head" >&2
                  exit 1
                }
                git fetch --no-tags origin \
                  refs/heads/main:refs/remotes/origin/coverage-main
                authoritative_main="$(git rev-parse refs/remotes/origin/coverage-main)"
                require_commit "$authoritative_main" "authoritative remote main SHA"
                merge_base="$(git merge-base "$EVENT_HEAD_SHA" "$authoritative_main")"
                if [[ "$first_parent" != "$merge_base" ]]; then
                  echo "first-push parent differs from merge-base with authoritative main" >&2
                  exit 1
                fi
                if [[ "$first_parent" != "$authoritative_main" ]]; then
                  echo "first-push parent is not the authoritative main SHA" >&2
                  exit 1
                fi
                comparison_sha="$first_parent"
                mode=verified-first-push-parent
              fi
              ;;
            workflow_dispatch)
              require_commit "$DISPATCH_BASE_SHA" "dispatch base SHA"
              require_commit "$EVENT_HEAD_SHA" "dispatch workflow source SHA"
              if [[ "$DISPATCH_BASE_SHA" != "$EVENT_HEAD_SHA" ]]; then
                echo "dispatch base differs from the trusted workflow source SHA" >&2
                exit 1
              fi
              mapfile -t parents < <(git show -s --format='%P' "$checked_out_head" | tr ' ' '\n')
              if [[ "${#parents[@]}" -ne 2 || "${parents[0]}" != "$DISPATCH_BASE_SHA" ]]; then
                echo "dispatch target first parent differs from the verified dispatch base" >&2
                exit 1
              fi
              comparison_sha="$DISPATCH_BASE_SHA"
              mode=certified-dispatch-base
              ;;
            *)
              echo "unsupported event for coverage comparison: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          require_commit "$comparison_sha" "resolved trusted comparison base"
          git merge-base --is-ancestor "$comparison_sha" "$checked_out_head" || {
            echo "resolved trusted comparison base is not an ancestor of the tested tree" >&2
            exit 1
