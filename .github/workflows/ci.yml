                git fetch --no-tags origin refs/heads/main:refs/remotes/origin/mobile-evidence-main
                remote_main="$(git rev-parse refs/remotes/origin/mobile-evidence-main)"
                [[ "$remote_main" == "$base" && "$(git merge-base "$candidate" "$remote_main")" == "$base" ]] || {
                  echo "Mobile first-publication main or merge-base drift" >&2; exit 1; }
              else
                require_commit "$EVENT_BEFORE" "Mobile push predecessor"
                git merge-base --is-ancestor "$EVENT_BEFORE" "$candidate" || { echo "Mobile push predecessor is not ancestral" >&2; exit 1; }
              fi
              ;;
            workflow_dispatch) echo "Mobile Booking capture rejects workflow_dispatch" >&2; exit 1 ;;
            *) echo "Unsupported Mobile Booking event" >&2; exit 1 ;;
