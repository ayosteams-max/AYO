name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact canonical Batch 1 landing commit SHA
        required: true
        type: string
      expected_base_sha:
        description: Exact authoritative main SHA at certification time
        required: true
        type: string
      approved_batch1_sha:
        description: Exact approved Batch 1 reconciliation head
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ayo_test
          POSTGRES_PASSWORD: ayo_test_password
          POSTGRES_USER: ayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayo_test -d ayo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AYO_TEST_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_test
      DEBUG: "true"
      TESTED_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_batch1_sha || github.event.pull_request.head.sha || github.sha }}
      BATCH1_ORIGINAL_SHA: 4e24dce178239f23abfabea7ff5a47f7ee319f68
      BATCH1_MERGE_SHA: cfd349185fa50b53f2d0f3735cf6b4d95f671e9a
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify trusted-main Batch 1 dispatch authority
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          APPROVED_BATCH1_SHA: ${{ inputs.approved_batch1_sha }}
          APPROVED_BATCH1_HEAD: cfd349185fa50b53f2d0f3735cf6b4d95f671e9a
          APPROVED_BATCH1_ORIGINAL: 4e24dce178239f23abfabea7ff5a47f7ee319f68
          APPROVED_BATCH1_BASE: 4c92b1c7088d1d54c8d15e5624085d370253c2b9
          CANONICAL_MESSAGE: Land governed Batch 1 reconciliation
          CANONICAL_NAME: AYO Governance Bot
          CANONICAL_EMAIL: governance@ayo.team
          CANONICAL_TIMESTAMP: 2026-08-04T00:00:00+00:00
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch certification must run from ref main" >&2
            exit 1
          fi
          if [[ "$APPROVED_BATCH1_SHA" != "$APPROVED_BATCH1_HEAD" ]]; then
            echo "Approved Batch 1 SHA input mismatch" >&2
            exit 1
          fi

          permission="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            | jq -r '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "Triggering actor lacks repository write authority: $permission" >&2; exit 1 ;;
          esac

          remote_main="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          if [[ "$EXPECTED_BASE_SHA" != "$remote_main" || "$GITHUB_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Expected base is not the exact authoritative main at execution" >&2
            exit 1
          fi

          read -ra target_parents <<< "$(git show -s --format=%P "$TARGET_SHA")"
          if [[ "${#target_parents[@]}" -ne 2 \
            || "${target_parents[0]}" != "$EXPECTED_BASE_SHA" \
            || "${target_parents[1]}" != "$APPROVED_BATCH1_SHA" ]]; then
            echo "Canonical landing parent topology mismatch" >&2
            exit 1
          fi

          merge_tree="$(git merge-tree --write-tree "$EXPECTED_BASE_SHA" "$APPROVED_BATCH1_SHA")"
          if [[ "$merge_tree" == *$'\n'* ]] || ! git cat-file -e "$merge_tree^{tree}"; then
            echo "Canonical merge is conflicted or did not produce one tree" >&2
            exit 1
          fi
          message_file="$(mktemp)"
          printf '%s\n' "$CANONICAL_MESSAGE" > "$message_file"
          calculated_sha="$(
            GIT_AUTHOR_NAME="$CANONICAL_NAME" \
            GIT_AUTHOR_EMAIL="$CANONICAL_EMAIL" \
            GIT_AUTHOR_DATE="$CANONICAL_TIMESTAMP" \
            GIT_COMMITTER_NAME="$CANONICAL_NAME" \
            GIT_COMMITTER_EMAIL="$CANONICAL_EMAIL" \
            GIT_COMMITTER_DATE="$CANONICAL_TIMESTAMP" \
            git -c commit.gpgSign=false -c i18n.commitEncoding=UTF-8 \
              commit-tree "$merge_tree" \
              -p "$EXPECTED_BASE_SHA" -p "$APPROVED_BATCH1_SHA" \
              -F "$message_file"
          )"
          rm -f "$message_file"
          if [[ "$calculated_sha" != "$TARGET_SHA" ]]; then
            echo "Canonical SHA mismatch: calculated=$calculated_sha target=$TARGET_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$TARGET_SHA^{tree}")" != "$merge_tree" ]]; then
            echo "Canonical landing tree mismatch" >&2
            exit 1
          fi
          if git cat-file commit "$TARGET_SHA" | grep -Eq '^(gpgsig|encoding) '; then
            echo "Signature or noncanonical encoding header detected" >&2
            exit 1
          fi

          mapfile -t approved_manifest < <(git diff --name-only "$APPROVED_BATCH1_BASE" "$APPROVED_BATCH1_ORIGINAL")
          mapfile -t target_manifest < <(git diff --name-only "$EXPECTED_BASE_SHA" "$TARGET_SHA")
          if [[ "${#approved_manifest[@]}" -ne 235 || "${#target_manifest[@]}" -ne 235 ]]; then
            echo "Batch 1 manifest count mismatch" >&2
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${approved_manifest[@]}") \
            <(printf '%s\n' "${target_manifest[@]}"); then
            echo "Batch 1 manifest identity mismatch" >&2
            exit 1
          fi
          if printf '%s\n' "${target_manifest[@]}" | grep -Fxq '.github/workflows/ci.yml'; then
            echo "Workflow path entered the Batch 1 manifest" >&2
            exit 1
          fi
          manifest_fingerprint="$(printf '%s\n' "${target_manifest[@]}" | sha256sum | awk '{print $1}')"
          trusted_workflow_blob="$(git rev-parse "$EXPECTED_BASE_SHA:.github/workflows/ci.yml")"
          target_workflow_blob="$(git rev-parse "$TARGET_SHA:.github/workflows/ci.yml")"
          if [[ "$trusted_workflow_blob" != "$target_workflow_blob" ]]; then
            echo "Target does not preserve the trusted-main workflow blob" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$TARGET_SHA:BACKEND")" != "5c4895867a7cbf7537158ba41fa7a5361d1ddf31" ]]; then
            echo "Batch 1 BACKEND tree mismatch" >&2
            exit 1
          fi
          declare -A migration_blobs=(
            [database/migrations/versions/20260716_0016_canonical_ride_request.py]=3c1e4b8400567b154582ffbb5f7426d933db1d23
            [database/migrations/versions/20260723_0055_courier_dispatch_increment1.py]=5f9def981c2db843e37dbd11e8b6f924f4d819fe
            [database/migrations/versions/20260724_0056_courier_pickup_increment1.py]=ba3ca02b8c2274edae02db5552fa2c0125bf0f19
          )
          for path in "${!migration_blobs[@]}"; do
            actual="$(git rev-parse "$TARGET_SHA:$path")"
            if [[ "$actual" != "${migration_blobs[$path]}" ]]; then
              echo "Migration blob mismatch: $path" >&2
              exit 1
            fi
            echo "Migration blob: $path=$actual"
          done
          if ! git diff --quiet "$APPROVED_BATCH1_SHA" "$TARGET_SHA" -- pyproject.toml uv.lock; then
            echo "Dependency or lockfile state changed after Batch 1 approval" >&2
            exit 1
          fi
          if [[ "$(git show "$TARGET_SHA:uv.lock" | awk '/^name = "cryptography"$/{getline; print; exit}')" != 'version = "50.0.0"' ]]; then
            echo "cryptography version mismatch" >&2
            exit 1
          fi

          echo "Workflow source main SHA: $GITHUB_SHA"
          echo "Expected base SHA: $EXPECTED_BASE_SHA"
          echo "Approved Batch 1 SHA: $APPROVED_BATCH1_SHA"
          echo "Target SHA: $TARGET_SHA"
          echo "Calculated canonical SHA: $calculated_sha"
          echo "Ordered parents: ${target_parents[*]}"
          echo "Landing tree hash: $merge_tree"
          echo "Manifest fingerprint: $manifest_fingerprint"
          git checkout --detach "$TARGET_SHA"

      - name: Establish governed post-Batch-1 validation contract
        run: |
          echo "Certified Batch 2 coverage baseline: 77.19024018299658%"
          echo "Coverage regression floor: 77.19024018299658%"
          echo "Coverage improvement target: 70%"
          echo "Governed Batch 2 test, migration, typing and secret contracts apply to every event"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify PostgreSQL 17 and PostGIS 3.5
        id: postgis
        run: |
          uv run --locked python - <<'PY'
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              dbname="ayo_test",
              user="ayo_test",
              password="ayo_test_password",
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_topology CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS fuzzystrmatch CASCADE")
                  cursor.execute("CREATE EXTENSION IF NOT EXISTS postgis")
                  cursor.execute("SHOW server_version")
                  server_version = cursor.fetchone()[0]
                  cursor.execute("SHOW server_version_num")
                  server_version_num = int(cursor.fetchone()[0])
                  cursor.execute("SELECT extversion FROM pg_extension WHERE extname = 'postgis'")
                  postgis_version = cursor.fetchone()[0]
                  cursor.execute("SELECT postgis_full_version()")
                  postgis_full_version = cursor.fetchone()[0]
                  cursor.execute("SELECT to_regtype('geometry') IS NOT NULL")
                  geometry_available = cursor.fetchone()[0]
                  cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = 'ayo_runtime'")
                  if cursor.fetchone() is None:
                      cursor.execute("CREATE ROLE ayo_runtime NOLOGIN")

          print(f"PostgreSQL server version: {server_version}")
          print(f"PostGIS extension version: {postgis_version}")
          print(f"PostGIS full version: {postgis_full_version}")
          print(f"geometry type available: {geometry_available}")
          if not 170000 <= server_version_num < 180000:
              raise SystemExit("PostgreSQL server major version is not 17")
          if not postgis_version.startswith("3.5"):
              raise SystemExit("PostGIS extension is not on the approved 3.5 line")
          if not geometry_available:
              raise SystemExit("PostGIS geometry type is unavailable")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Select exact governed evidence contract
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        id: evidence_contract
        run: |
          set -euo pipefail
          expected_helper_blob=287462f26399bdeb4964030fa5aac6170fb1a607
          expected_ci_normalized_sha256="aabedc312984b5cfbccfc77fd8173dcd""0d281fa662befe7209510814c135044b"
          p="$expected_ci_normalized_sha256"
          helper_blob="$(git rev-parse "$TESTED_COMMIT_SHA:tools/validate_ci_governance_evidence.py" 2>/dev/null || true)"
          [[ "$helper_blob" == "$expected_helper_blob" ]] || {
            echo "Unreviewed governance evidence helper" >&2; exit 1; }
          tests_tree="$(git rev-parse HEAD:tests)"
          mobile_tests_tree=""
          mobile_tree=""
          case "$tests_tree" in
            ffc42ae8b0d32093a03674f1ec0380bbc4a60486)
              mode=pre-batch2
              ;;
            48ce81c2ee545a5f7a37d65cfd0c4ddd59ead1ff)
              mode=batch2
              ;;
            90b974a321c2423909926cbefe58a39ad1685436)
              mode=courier-pickup-idempotency-v1
              ;;
            b30243de4bcc3b082a1222d368e9f7e9ef91cbdc)
              mode=courier-pickup-authorization-ordering
              ;;
            ab795c7d2e200dac15215770fefae48b515fca68)
              mode=immediate-standard-public-contract
              ;;
            382a299236787d20a567cc5934a8f82d0147e7ad)
              mode=booking-complete-replay-equivalence
              ;;
            efd4172d0ff7e790e36af9c7fecddafb426b0b67|cf01f4061000f081cf8fe54fbc29e168f4b6f127|edd03e3f8c41e245bdb66861fddf3f79aab3b959)
              registry_candidate="$TESTED_COMMIT_SHA"
              registry_blob="$(git rev-parse "$registry_candidate:docs/AYO_DECISION_ID_REGISTRY.json")"
              registry_decision_blob="$(git rev-parse "$registry_candidate:docs/AYO_DECISION_LOG.md")"
              registry_test_blob="$(git rev-parse "$registry_candidate:tests/governance/test_ap_decision_registry.py")"
              registry_trusted_base_test_blob="$(git rev-parse "$registry_candidate:tests/governance/test_ci_trusted_comparison_base.py" 2>/dev/null || true)"
              registry_validator_blob="$(git rev-parse "$registry_candidate:tools/validate_ap_decision_registry.py")"
              expected_ap_registry_ci_normalized_sha256="6da968ea89b46101""0c2be073e2c40982""1750d918c618aab4""15913468bdabf0d3"
              expected_ap_registry_active_state_ci_normalized_sha256="6da968ea89b46101""0c2be073e2c40982""1750d918c618aab4""15913468bdabf0d3"
              expected_ap_main_ci_sha256="6da968ea89b461010c2be073e2c40982""1750d918c618aab415913468bdabf0d3"
              ap_registry_ci_normalized_sha256="$(python tools/validate_ci_governance_evidence.py workflow-commitment --scope ap --workflow .github/workflows/ci.yml)"
              if [[ "$registry_blob" == d0d84754a49e9f87f370ed0e7d49de026d8fc5bc \
                && "$registry_decision_blob" == 8533182c326e3d625f96bdac1410dbdb2f774158 \
                && "$registry_test_blob" == 9f15b8c5e8591c7f72730c20431a88a4aa932144 \
                && "$registry_validator_blob" == 0206e15654a0d4d57275476bfa452bee15c2e2bf \
                && "$ap_registry_ci_normalized_sha256" == "$expected_ap_registry_ci_normalized_sha256" ]]; then
                mode=ap-decision-registry-main-landing
              elif [[ "$registry_blob" == 2ffb2cfb9f6ac410cf4f75a7b4460ea95fc117c2 \
                && "$registry_decision_blob" == 8533182c326e3d625f96bdac1410dbdb2f774158 \
                && "$registry_test_blob" == 9f15b8c5e8591c7f72730c20431a88a4aa932144 \
                && "$registry_validator_blob" == 0206e15654a0d4d57275476bfa452bee15c2e2bf ]]; then
                case "$registry_trusted_base_test_blob|$ap_registry_ci_normalized_sha256" in
                  0fd58b8d7deecc09372068c9763c1b21a06ab4e5\|"$expected_ap_registry_active_state_ci_normalized_sha256") mode=ap-registry-active-state-correction ;;
                  600dbcab98b0e57e16b562bcc5699e420610c413\|"$expected_ap_main_ci_sha256") mode=ap-registry-active-state-main-ci-correction ;;
                  *) echo AP_STATE_ID_DRIFT >&2; exit 1 ;;
                esac
              else
                echo "Unreviewed AP-registry candidate identity" >&2
                exit 1
              fi
              ;;
            2dbcb487bd27578a95d0db9a31c21ecde7032114)
              dependency_candidate="$TESTED_COMMIT_SHA"
              dependency_pyproject_blob="$(git rev-parse "$dependency_candidate:pyproject.toml")"
              dependency_lock_blob="$(git rev-parse "$dependency_candidate:uv.lock")"
              dependency_decision_blob="$(git rev-parse "$dependency_candidate:docs/AYO_DECISION_LOG.md")"
              ci_normalized_sha256="$(python tools/validate_ci_governance_evidence.py workflow-commitment --scope pip --workflow .github/workflows/ci.yml)"
              if [[ "$dependency_pyproject_blob" == a9eebc6ce34459318b3b58a7a0217dba571e8e1a \
                && "$dependency_lock_blob" == b340334a94f1479199d7e3784474e9a16020a121 \
                && "$dependency_decision_blob" == a071b48fcb1e08938893788abcfbc4e6067e05f9 ]]; then
                [[ "$ci_normalized_sha256" == "$p" ]] || {
                  echo "Unreviewed pip-remediation workflow identity" >&2; exit 1; }
                mode=pip-audit-toolchain-remediation
              else
              mobile_candidate="$TESTED_COMMIT_SHA"
              [[ "$mobile_candidate" =~ ^[0-9a-f]{40}$ \
                && "$mobile_candidate" != 0000000000000000000000000000000000000000 ]] || {
                echo "Mobile selector candidate is absent, malformed, or all-zero" >&2; exit 1; }
              git cat-file -e "$mobile_candidate^{commit}" 2>/dev/null || {
                echo "Mobile selector candidate is unavailable" >&2; exit 1; }
              mobile_tests_tree="$(git rev-parse "$mobile_candidate:AYO-Mobile/tests")"
              mobile_tree="$(git rev-parse "$mobile_candidate:AYO-Mobile")"
              case "$mobile_tests_tree|$mobile_tree" in
                d7143a733cf14e70851406dab8131ce7c69dd364\|da39714a911ffbf02171d28348c88a39eab2d938)
                  approval_pack_architecture_path=docs/AYO_BOOKING_CONSENT_APPROVAL_PACK_ARCHITECTURE.md
                  approval_pack_template_path=docs/AYO_BOOKING_CONSENT_APPROVAL_PACK_TEMPLATE.md
                  approval_pack_architecture_present=false
                  approval_pack_template_present=false
                  git cat-file -e "$mobile_candidate:$approval_pack_architecture_path" 2>/dev/null && approval_pack_architecture_present=true
                  git cat-file -e "$mobile_candidate:$approval_pack_template_path" 2>/dev/null && approval_pack_template_present=true
                  if [[ "$approval_pack_architecture_present" == true || "$approval_pack_template_present" == true ]]; then
                    [[ "$approval_pack_architecture_present" == true && "$approval_pack_template_present" == true ]] || {
                      echo "Partial Booking consent approval-pack architecture identity" >&2; exit 1; }
                    approval_pack_architecture_blob="$(git rev-parse "$mobile_candidate:$approval_pack_architecture_path")"
                    approval_pack_template_blob="$(git rev-parse "$mobile_candidate:$approval_pack_template_path")"
                    decision_blob="$(git rev-parse "$mobile_candidate:docs/AYO_DECISION_LOG.md")"
                    roadmap_blob="$(git rev-parse "$mobile_candidate:docs/AYO_ROADMAP.md")"
                    consent_architecture_blob="$(git rev-parse "$mobile_candidate:docs/AYO_BOOKING_CONSENT_DOCUMENT_DELIVERY_CONTRACT_ARCHITECTURE.md")"
                    baseline_blob="$(git rev-parse "$mobile_candidate:.secrets.baseline")"
                    backend_tree="$(git rev-parse "$mobile_candidate:BACKEND")"
                    migration_tree="$(git rev-parse "$mobile_candidate:database/migrations")"
                    package_blob="$(git rev-parse "$mobile_candidate:AYO-Mobile/package.json")"
                    lockfile_blob="$(git rev-parse "$mobile_candidate:AYO-Mobile/package-lock.json")"
                    root_package_blob="$(git rev-parse "$mobile_candidate:pyproject.toml")"
                    root_lockfile_blob="$(git rev-parse "$mobile_candidate:uv.lock")"
                    alembic_blob="$(git rev-parse "$mobile_candidate:alembic.ini")"
                    python_version_blob="$(git rev-parse "$mobile_candidate:.python-version")"
                    approval_pack_tuple="$approval_pack_architecture_blob|$approval_pack_template_blob|$decision_blob|$roadmap_blob|$consent_architecture_blob|$baseline_blob|$backend_tree|$migration_tree|$package_blob|$lockfile_blob|$root_package_blob|$root_lockfile_blob|$alembic_blob|$python_version_blob"
                    expected_approval_pack_tuple="a2285429b91f73de067807ababb0780a088d5e7a|5d7218a9bd2ecc5d4561fe6164a6864e50cadb16|e814581988391fff1a4d388f58c80202c182c0bd|d5313d04a9d160c38e129217fb4aceae06afb068|54d69775049d6f0af12fe6ace2bfc5a8cf66ad81|71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02|62500035ef60d94ccc6333f25cb3aa79ff5c3f21|253ecedebe58c31077a0baa7d2532adc46464f70|b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2|ace7192e4a749f61a011f8e4293ccd1e053d648a|6b8425f6ed81258388c4e6bba39c80af0afa7fef|6a08d31b721b486950fd06df0ca3430fcbe8aabf|a2353502812251c10e36f8cd534de71c1dcca58b|ebe773d9eeab42ab1f896401f5b9c581f88d6709"
                    [[ "$approval_pack_tuple" == "$expected_approval_pack_tuple" ]] || {
                      echo "Unreviewed Booking consent approval-pack architecture identity" >&2; exit 1; }
                    mode=booking-consent-approval-pack-architecture
                  else
                    candidate_decision_blob="$(git rev-parse "$mobile_candidate:docs/AYO_DECISION_LOG.md")"
                    candidate_roadmap_blob="$(git rev-parse "$mobile_candidate:docs/AYO_ROADMAP.md")"
                    if [[ "$candidate_decision_blob" == e814581988391fff1a4d388f58c80202c182c0bd \
                      || "$candidate_roadmap_blob" == d5313d04a9d160c38e129217fb4aceae06afb068 ]]; then
                      echo "Missing Booking consent approval-pack architecture identity" >&2
                      exit 1
                    fi
                    architecture_path=docs/AYO_BOOKING_CONSENT_DOCUMENT_DELIVERY_CONTRACT_ARCHITECTURE.md
                    if git cat-file -e "$mobile_candidate:$architecture_path" 2>/dev/null; then
                    architecture_blob="$(git rev-parse "$mobile_candidate:$architecture_path")"
                    decision_blob="$(git rev-parse "$mobile_candidate:docs/AYO_DECISION_LOG.md")"
                    roadmap_blob="$(git rev-parse "$mobile_candidate:docs/AYO_ROADMAP.md")"
                    baseline_blob="$(git rev-parse "$mobile_candidate:.secrets.baseline")"
                    backend_tree="$(git rev-parse "$mobile_candidate:BACKEND")"
                    migration_tree="$(git rev-parse "$mobile_candidate:database/migrations")"
                    package_blob="$(git rev-parse "$mobile_candidate:AYO-Mobile/package.json")"
                    lockfile_blob="$(git rev-parse "$mobile_candidate:AYO-Mobile/package-lock.json")"
                    architecture_tuple="$architecture_blob|$decision_blob|$roadmap_blob|$baseline_blob|$backend_tree|$migration_tree|$package_blob|$lockfile_blob"
                    expected_architecture_tuple="54d69775049d6f0af12fe6ace2bfc5a8cf66ad81|181226620a4eb7abca4c5eb785ecb965e9a82900|e459cd12961c5264dd7df8f1cbc5328e854f73a1|71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02|62500035ef60d94ccc6333f25cb3aa79ff5c3f21|253ecedebe58c31077a0baa7d2532adc46464f70|b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2|ace7192e4a749f61a011f8e4293ccd1e053d648a"
                    [[ "$architecture_tuple" == "$expected_architecture_tuple" ]] || {
                      echo "Unreviewed consent document architecture identity" >&2; exit 1; }
                    mode=booking-consent-document-delivery-architecture
                  else
