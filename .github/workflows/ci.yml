              "test_or_environment_unlock": r"\b(?:createTestBookingIntentController|process\.env|EXPO_PUBLIC_)\b",
              "durable_storage": r"\b(?:AsyncStorage|SecureStore|localStorage|sessionStorage)\b",
              "sensitive_logging": r"\bconsole\.(?:log|info|warn|error|debug)\b",
              "unsafe_suppression": r"(?:@ts-ignore|@ts-expect-error|eslint-disable|\bas\s+any\b|\bas\s+never\b)",
              "provider_payment_notification_analytics": r"\b(?:Stripe|Payment|Notifications?|Analytics|Crashlytics|Dispatch)\b",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, corpus, re.IGNORECASE):
                  raise SystemExit(f"Mobile Booking source-safety failure: {label}")
          context = Path("AYO-Mobile/contexts/booking-intent.tsx").read_text(encoding="utf-8")
          provider_props = next(
              (line for line in context.splitlines() if line.startswith("type BookingIntentProviderProps=")), ""
