              "roadmap_blob": "e459cd12961c5264dd7df8f1cbc5328e854f73a1",
              "root_tests_tree": "2dbcb487bd27578a95d0db9a31c21ecde7032114",
              "mobile_tree": "da39714a911ffbf02171d28348c88a39eab2d938",
              "mobile_tests_tree": "d7143a733cf14e70851406dab8131ce7c69dd364",
              "backend_tree": "62500035ef60d94ccc6333f25cb3aa79ff5c3f21",
              "migration_tree": "253ecedebe58c31077a0baa7d2532adc46464f70",
              "package_blob": "b4c26fea6a74ac9c1d3a442eb855cf63538fb5e2",
              "lockfile_blob": "ace7192e4a749f61a011f8e4293ccd1e053d648a",
              "baseline_blob": "71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02",
          }

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout.strip()

          changed = git("diff", "--name-only", BASE, CANDIDATE).splitlines()
          if changed != EXPECTED_PATHS:
              raise SystemExit("Consent architecture evidence manifest drift")
          manifest = hashlib.sha256("\n".join(changed).encode()).hexdigest()
          if manifest != "63d1c323dc5b1a9173e3796f3efa20e286a678c18ef0020c5ae93ddcb39ec1ba":
              raise SystemExit("Consent architecture evidence manifest fingerprint drift")
          actual = {
