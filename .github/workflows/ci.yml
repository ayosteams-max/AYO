              raise SystemExit("ordinary 70% coverage command did not fail with status 1")

          junit = ET.parse("pytest-results.xml").getroot()
          cases = junit.findall(".//testcase")
          failures = [case for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          skipped_cases = [case for case in cases if case.find("skipped") is not None]
          xfailed = []
          skipped = []
          for case in skipped_cases:
              item = case.find("skipped")
              diagnostic = " ".join((item.get("type", ""), item.get("message", ""))).lower()
              (xfailed if "xfail" in diagnostic else skipped).append(case)
          passed = len(cases) - len(failures) - len(errors) - len(skipped_cases)
          actual_inventory = {
              "passed": passed,
              "failed": len(failures),
              "errors": len(errors),
              "skipped": len(skipped),
              "xfailed": len(xfailed),
          }
          expected_inventory = {
              "passed": 293,
              "failed": 0,
              "errors": 0,
              "skipped": 0,
              "xfailed": 1,
          }
          if actual_inventory != expected_inventory:
              raise SystemExit(f"Batch 1 test inventory drift: {actual_inventory!r}")

          log = open("batch1-coverage.log", encoding="utf-8").read()
          if "4 deselected" not in log:
              raise SystemExit("Batch 1 exact four-test deselection count disappeared")
          if "FAIL Required test coverage of 70% not reached" not in log:
              raise SystemExit("ordinary 70% threshold was not the sole reported failure")

          coverage = json.load(open("batch1-coverage.json", encoding="utf-8"))
          totals = coverage["totals"]
          actual_totals = (
              totals["num_statements"],
              totals["missing_lines"],
              f'{totals["percent_covered"]:.8f}',
          )
          if actual_totals != (20835, 7969, "56.38838839"):
              raise SystemExit(f"Batch 1 coverage totals drift: {actual_totals!r}")

          normalized = []
          collected = set()
          for path, evidence in sorted(coverage["files"].items()):
              path = path[path.find("BACKEND/"):]
              collected.add(path)
              normalized.append([
                  path,
                  evidence["summary"],
                  evidence.get("executed_lines", []),
                  evidence.get("missing_lines", []),
                  evidence.get("executed_branches", []),
                  evidence.get("missing_branches", []),
              ])
          fingerprint = hashlib.sha256(
              json.dumps(normalized, separators=(",", ":"), sort_keys=True).encode()
          ).hexdigest()
          if fingerprint != approved_fingerprint:
              raise SystemExit(f"Batch 1 semantic coverage fingerprint drift: {fingerprint}")

          zero_coverage = {
              path[path.find("BACKEND/"):]
              for path, evidence in coverage["files"].items()
              if evidence["summary"]["num_statements"]
              and evidence["summary"]["covered_lines"] == 0
          }
          if zero_coverage != expected_zero_coverage:
              raise SystemExit(f"Batch 1 zero-coverage inventory drift: {sorted(zero_coverage)!r}")
          tracked_python = set(
              subprocess.run(
                  ["git", "ls-files", "BACKEND/**/*.py"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
          )
          uncollected = tracked_python - collected
          if uncollected != expected_uncollected | expected_preexisting_uncollected:
              raise SystemExit(f"Batch 1 uncollected-file inventory drift: {sorted(uncollected)!r}")
          actual_deselections = set(
              open("batch1-deselections.txt", encoding="utf-8").read().splitlines()
          )
          if actual_deselections != expected_deselections:
              raise SystemExit(f"Batch 1 governed deselection drift: {sorted(actual_deselections)!r}")

          print("Batch 1 tested SHA:", tested_sha)
          print("Batch 1 BACKEND tree:", backend_tree)
          print("Batch 1 test inventory:", actual_inventory, "deselected=4")
          print("Batch 1 coverage totals:", actual_totals)
          print("Batch 1 semantic coverage fingerprint:", fingerprint)
          print("Batch 1 zero-coverage modules:", len(zero_coverage))
          print("Batch 1 historically uncollected checkpoint files:", len(expected_uncollected))
