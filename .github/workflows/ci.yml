name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact canonical Batch 1 landing commit SHA
        required: true
        type: string
      expected_base_sha:
        description: Exact authoritative main SHA at certification time
        required: true
        type: string
      approved_batch1_sha:
        description: Exact approved Batch 1 reconciliation head
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ayo_test
          POSTGRES_PASSWORD: ayo_test_password
          POSTGRES_USER: ayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayo_test -d ayo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AYO_TEST_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_test
      DEBUG: "true"
      TESTED_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_batch1_sha || github.event.pull_request.head.sha || github.sha }}
      BATCH1_ORIGINAL_SHA: 4e24dce178239f23abfabea7ff5a47f7ee319f68
      BATCH1_MERGE_SHA: cfd349185fa50b53f2d0f3735cf6b4d95f671e9a
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify trusted-main Batch 1 dispatch authority
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          APPROVED_BATCH1_SHA: ${{ inputs.approved_batch1_sha }}
          APPROVED_BATCH1_HEAD: cfd349185fa50b53f2d0f3735cf6b4d95f671e9a
          APPROVED_BATCH1_ORIGINAL: 4e24dce178239f23abfabea7ff5a47f7ee319f68
          APPROVED_BATCH1_BASE: 4c92b1c7088d1d54c8d15e5624085d370253c2b9
          CANONICAL_MESSAGE: Land governed Batch 1 reconciliation
          CANONICAL_NAME: AYO Governance Bot
          CANONICAL_EMAIL: governance@ayo.team
          CANONICAL_TIMESTAMP: 2026-08-04T00:00:00+00:00
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch certification must run from ref main" >&2
            exit 1
          fi
          if [[ "$APPROVED_BATCH1_SHA" != "$APPROVED_BATCH1_HEAD" ]]; then
            echo "Approved Batch 1 SHA input mismatch" >&2
            exit 1
          fi

          permission="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            | jq -r '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "Triggering actor lacks repository write authority: $permission" >&2; exit 1 ;;
          esac

          remote_main="$(curl --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          if [[ "$EXPECTED_BASE_SHA" != "$remote_main" || "$GITHUB_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Expected base is not the exact authoritative main at execution" >&2
            exit 1
          fi

          read -ra target_parents <<< "$(git show -s --format=%P "$TARGET_SHA")"
          if [[ "${#target_parents[@]}" -ne 2 \
            || "${target_parents[0]}" != "$EXPECTED_BASE_SHA" \
            || "${target_parents[1]}" != "$APPROVED_BATCH1_SHA" ]]; then
            echo "Canonical landing parent topology mismatch" >&2
            exit 1
          fi

          merge_tree="$(git merge-tree --write-tree "$EXPECTED_BASE_SHA" "$APPROVED_BATCH1_SHA")"
          if [[ "$merge_tree" == *$'\n'* ]] || ! git cat-file -e "$merge_tree^{tree}"; then
            echo "Canonical merge is conflicted or did not produce one tree" >&2
            exit 1
          fi
          message_file="$(mktemp)"
          printf '%s\n' "$CANONICAL_MESSAGE" > "$message_file"
          calculated_sha="$(
            GIT_AUTHOR_NAME="$CANONICAL_NAME" \
            GIT_AUTHOR_EMAIL="$CANONICAL_EMAIL" \
            GIT_AUTHOR_DATE="$CANONICAL_TIMESTAMP" \
            GIT_COMMITTER_NAME="$CANONICAL_NAME" \
            GIT_COMMITTER_EMAIL="$CANONICAL_EMAIL" \
            GIT_COMMITTER_DATE="$CANONICAL_TIMESTAMP" \
            git -c commit.gpgSign=false -c i18n.commitEncoding=UTF-8 \
              commit-tree "$merge_tree" \
              -p "$EXPECTED_BASE_SHA" -p "$APPROVED_BATCH1_SHA" \
              -F "$message_file"
          )"
          rm -f "$message_file"
          if [[ "$calculated_sha" != "$TARGET_SHA" ]]; then
            echo "Canonical SHA mismatch: calculated=$calculated_sha target=$TARGET_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$TARGET_SHA^{tree}")" != "$merge_tree" ]]; then
            echo "Canonical landing tree mismatch" >&2
            exit 1
          fi
          if git cat-file commit "$TARGET_SHA" | grep -Eq '^(gpgsig|encoding) '; then
            echo "Signature or noncanonical encoding header detected" >&2
            exit 1
          fi

          mapfile -t approved_manifest < <(git diff --name-only "$APPROVED_BATCH1_BASE" "$APPROVED_BATCH1_ORIGINAL")
          mapfile -t target_manifest < <(git diff --name-only "$EXPECTED_BASE_SHA" "$TARGET_SHA")
          if [[ "${#approved_manifest[@]}" -ne 235 || "${#target_manifest[@]}" -ne 235 ]]; then
            echo "Batch 1 manifest count mismatch" >&2
            exit 1
          fi
          if ! diff -u \
            <(printf '%s\n' "${approved_manifest[@]}") \
            <(printf '%s\n' "${target_manifest[@]}"); then
            echo "Batch 1 manifest identity mismatch" >&2
            exit 1
          fi
          if printf '%s\n' "${target_manifest[@]}" | grep -Fxq '.github/workflows/ci.yml'; then
            echo "Workflow path entered the Batch 1 manifest" >&2
            exit 1
          fi
          manifest_fingerprint="$(printf '%s\n' "${target_manifest[@]}" | sha256sum | awk '{print $1}')"
          trusted_workflow_blob="$(git rev-parse "$EXPECTED_BASE_SHA:.github/workflows/ci.yml")"
          target_workflow_blob="$(git rev-parse "$TARGET_SHA:.github/workflows/ci.yml")"
          if [[ "$trusted_workflow_blob" != "$target_workflow_blob" ]]; then
            echo "Target does not preserve the trusted-main workflow blob" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$TARGET_SHA:BACKEND")" != "5c4895867a7cbf7537158ba41fa7a5361d1ddf31" ]]; then
            echo "Batch 1 BACKEND tree mismatch" >&2
            exit 1
          fi
          declare -A migration_blobs=(
            [database/migrations/versions/20260716_0016_canonical_ride_request.py]=3c1e4b8400567b154582ffbb5f7426d933db1d23
            [database/migrations/versions/20260723_0055_courier_dispatch_increment1.py]=5f9def981c2db843e37dbd11e8b6f924f4d819fe
            [database/migrations/versions/20260724_0056_courier_pickup_increment1.py]=ba3ca02b8c2274edae02db5552fa2c0125bf0f19
          )
          for path in "${!migration_blobs[@]}"; do
            actual="$(git rev-parse "$TARGET_SHA:$path")"
            if [[ "$actual" != "${migration_blobs[$path]}" ]]; then
              echo "Migration blob mismatch: $path" >&2
              exit 1
            fi
            echo "Migration blob: $path=$actual"
          done
          if ! git diff --quiet "$APPROVED_BATCH1_SHA" "$TARGET_SHA" -- pyproject.toml uv.lock; then
            echo "Dependency or lockfile state changed after Batch 1 approval" >&2
            exit 1
          fi
          if [[ "$(git show "$TARGET_SHA:uv.lock" | awk '/^name = "cryptography"$/{getline; print; exit}')" != 'version = "50.0.0"' ]]; then
            echo "cryptography version mismatch" >&2
            exit 1
          fi

          echo "Workflow source main SHA: $GITHUB_SHA"
          echo "Expected base SHA: $EXPECTED_BASE_SHA"
          echo "Approved Batch 1 SHA: $APPROVED_BATCH1_SHA"
          echo "Target SHA: $TARGET_SHA"
          echo "Calculated canonical SHA: $calculated_sha"
          echo "Ordered parents: ${target_parents[*]}"
          echo "Landing tree hash: $merge_tree"
          echo "Manifest fingerprint: $manifest_fingerprint"
          git checkout --detach "$TARGET_SHA"

      - name: Establish governed post-Batch-1 validation contract
        run: |
          echo "Certified Batch 2 coverage baseline: 77.19024018299658%"
          echo "Coverage regression floor: 77.19024018299658%"
          echo "Coverage improvement target: 70%"
          echo "Governed Batch 2 test, migration, typing and secret contracts apply to every event"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify PostgreSQL 17 and PostGIS 3.5
        id: postgis
        run: |
          uv run --locked python - <<'PY'
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              dbname="ayo_test",
              user="ayo_test",
              password="ayo_test_password",
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_topology CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS fuzzystrmatch CASCADE")
                  cursor.execute("CREATE EXTENSION IF NOT EXISTS postgis")
                  cursor.execute("SHOW server_version")
                  server_version = cursor.fetchone()[0]
                  cursor.execute("SHOW server_version_num")
                  server_version_num = int(cursor.fetchone()[0])
                  cursor.execute("SELECT extversion FROM pg_extension WHERE extname = 'postgis'")
                  postgis_version = cursor.fetchone()[0]
                  cursor.execute("SELECT postgis_full_version()")
                  postgis_full_version = cursor.fetchone()[0]
                  cursor.execute("SELECT to_regtype('geometry') IS NOT NULL")
                  geometry_available = cursor.fetchone()[0]
                  cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = 'ayo_runtime'")
                  if cursor.fetchone() is None:
                      cursor.execute("CREATE ROLE ayo_runtime NOLOGIN")

          print(f"PostgreSQL server version: {server_version}")
          print(f"PostGIS extension version: {postgis_version}")
          print(f"PostGIS full version: {postgis_full_version}")
          print(f"geometry type available: {geometry_available}")
          if not 170000 <= server_version_num < 180000:
              raise SystemExit("PostgreSQL server major version is not 17")
          if not postgis_version.startswith("3.5"):
              raise SystemExit("PostGIS extension is not on the approved 3.5 line")
          if not geometry_available:
              raise SystemExit("PostGIS geometry type is unavailable")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Select exact governed evidence contract
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        id: evidence_contract
        run: |
          set -euo pipefail
          tests_tree="$(git rev-parse HEAD:tests)"
          case "$tests_tree" in
            ffc42ae8b0d32093a03674f1ec0380bbc4a60486)
              mode=pre-batch2
              ;;
            48ce81c2ee545a5f7a37d65cfd0c4ddd59ead1ff)
              mode=batch2
              ;;
            90b974a321c2423909926cbefe58a39ad1685436)
              mode=courier-pickup-idempotency-v1
              ;;
            b30243de4bcc3b082a1222d368e9f7e9ef91cbdc)
              mode=courier-pickup-authorization-ordering
              ;;
            ab795c7d2e200dac15215770fefae48b515fca68)
              mode=immediate-standard-public-contract
              ;;
            a54dc4b68b6f1882d5f81e247460d3e4ffbab062)
              mode=booking-complete-replay-equivalence
              ;;
            *)
              echo "Unreviewed tests tree: $tests_tree" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tests_tree=$tests_tree" >> "$GITHUB_OUTPUT"
          echo "Governed evidence mode: $mode"
          echo "Governed tests tree: $tests_tree"

      - name: Bind exact Courier Pickup Idempotency V1 candidate identity
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true' && steps.evidence_contract.outputs.mode == 'courier-pickup-idempotency-v1'
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import hashlib
          import os
          import subprocess

          expected = {
              "base": "4eda7c5e80907eba9b60c20d64561087ef50c84b",
              "candidate": "3e89c5f62640515158acc5bb99bf77d661dbf187",
              "tree": "da9b3193004c81f49d5259c46ed1abae76d3edf4",
              "backend": "922eedd43fa5aba1356dabf84a7f2b55735a83ab",
              "tests": "90b974a321c2423909926cbefe58a39ad1685436",
              "manifest": "fea72f1893f61ce043ab744a29e8fb43337b0d26a08fe54b8caef38c0bde005f",
              "migration": "1152223fb6fe0237745e37834fa56076b080d4d0",
          }
          paths = [
              "BACKEND/courier_pickup/application.py",
              "BACKEND/courier_pickup/idempotency.py",
              "BACKEND/persistence/courier_pickup_repository.py",
              "BACKEND/persistence/tables.py",
              "database/migrations/versions/20260805_0057_courier_pickup_idempotency_replay.py",
              "tests/integration/test_courier_pickup_idempotency.py",
              "tests/integration/test_migrations.py",
              "tests/integration/test_request_access_provenance.py",
              "tests/test_courier_pickup_idempotency.py",
              "tests/test_migration_foundation.py",
          ]
          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True,
              ).stdout.strip()
          reviewed_head = expected["candidate"]
          if git("rev-parse", reviewed_head) != reviewed_head:
              raise SystemExit("reviewed Courier Pickup candidate SHA is unavailable")
          if git("merge-base", expected["base"], reviewed_head) != expected["base"]:
              raise SystemExit("Courier Pickup candidate is not descended from its reviewed base")
          if git("show", "-s", "--format=%T", reviewed_head) != expected["tree"]:
              raise SystemExit("Courier Pickup candidate tree drift")
          if git("rev-parse", f"{reviewed_head}:BACKEND") != expected["backend"]:
              raise SystemExit("Courier Pickup BACKEND tree drift")
          if git("rev-parse", f"{reviewed_head}:tests") != expected["tests"]:
              raise SystemExit("Courier Pickup tests tree drift")
          if git("rev-parse", f"{reviewed_head}:database/migrations/versions/20260805_0057_courier_pickup_idempotency_replay.py") != expected["migration"]:
              raise SystemExit("Migration 0057 blob drift")
          changed = git("diff", "--name-only", expected["base"], reviewed_head).splitlines()
          if changed != paths:
              raise SystemExit(f"Courier Pickup ten-path boundary drift: {changed!r}")
          fingerprint = hashlib.sha256("\n".join(changed).encode()).hexdigest()
          if fingerprint != expected["manifest"]:
              raise SystemExit(f"Courier Pickup manifest fingerprint drift: {fingerprint}")
          forbidden = (
              ".github/", ".secrets.baseline", "pyproject.toml", "uv.lock",
              "AYO-Mobile/", "docs/", "BACKEND/courier_dispatch/", "BACKEND/custody/",
              "BACKEND/authorization/registry.py",
          )
          if any(path.startswith(forbidden) for path in changed):
              raise SystemExit("Courier Pickup candidate contains a forbidden path")
          print("Courier Pickup Idempotency V1 exact candidate identity: PASS")
          print("Courier Pickup ten-path manifest fingerprint:", fingerprint)
          PY

      - name: Bind exact Courier Pickup authorization-ordering candidate identity
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true' && steps.evidence_contract.outputs.mode == 'courier-pickup-authorization-ordering'
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import hashlib
          import subprocess

          expected = {
              "base": "65ff78430315c2d10bc40a0f3edafced6cec3ad2",
              "candidate": "f764189398f70d7e9fecdb217362a26e0ac09f35",
              "commits": [
                  "9cb075d91cb163a0ee2c4334d71ddf61c205f15f",
                  "c1d58ab059c93ab113462cdd4c352e01eb86d2d7",
                  "f764189398f70d7e9fecdb217362a26e0ac09f35",
              ],
              "tree": "65cdf5cef8605cd1b4e31443dca902ddb8d31225",
              "backend": "29bb7bf4fc568c9c961e849872d5cef91d69e158",
              "tests": "b30243de4bcc3b082a1222d368e9f7e9ef91cbdc",
              "migrations": "3997d1a4022db4cb844b3283b454682eeb0420f2",
              "workflow": "be0cc913cd29e1679715f4aa742b00af5c53de6a",
              "secrets": "71770a9e529e9af0c9ed5c72549b3a2f7ddcfb02",
              "pyproject": "6b8425f6ed81258388c4e6bba39c80af0afa7fef",
              "lock": "6a08d31b721b486950fd06df0ca3430fcbe8aabf",
              "manifest": "0ac039f011a6b88c472ad84af9770e98abc0c50fee2518a36515e04a3cd1bf5d",
          }
          paths = [
              "BACKEND/courier_pickup/application.py",
              "BACKEND/routes/courier_pickup.py",
              "tests/integration/test_courier_pickup_authorization_ordering.py",
              "tests/test_courier_pickup_authorization_ordering.py",
              "tests/test_courier_pickup_increment1.py",
          ]
          blobs = {
              paths[0]: "4a0c47355d1862e976d0d9bf539a158ec6aab8cc",
              paths[1]: "39e151d8acb1f58c9346686a431108c4d5faa5d1",
              paths[2]: "fe32fb5aa6b097c7eec26d03cf414f367209e6f5",
              paths[3]: "c253c67026694e966dc6d36b55e949858e58fef9",
              paths[4]: "7ea9bac56969120d7258efa0bf8a0cbfcd53ffc1",
          }

          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True,
              ).stdout.strip()

          base, head = expected["base"], expected["candidate"]
          if git("rev-parse", head) != head or git("merge-base", base, head) != base:
              raise SystemExit("reviewed authorization-ordering candidate ancestry drift")
          commits = git("rev-list", "--reverse", f"{base}..{head}").splitlines()
          if commits != expected["commits"]:
              raise SystemExit(f"reviewed authorization-ordering commit sequence drift: {commits!r}")
          identities = {
              "tree": git("show", "-s", "--format=%T", head),
              "backend": git("rev-parse", f"{head}:BACKEND"),
              "tests": git("rev-parse", f"{head}:tests"),
              "migrations": git("rev-parse", f"{head}:database/migrations/versions"),
              "workflow": git("rev-parse", f"{head}:.github/workflows/ci.yml"),
              "secrets": git("rev-parse", f"{head}:.secrets.baseline"),
              "pyproject": git("rev-parse", f"{head}:pyproject.toml"),
              "lock": git("rev-parse", f"{head}:uv.lock"),
          }
          for name, actual in identities.items():
              if actual != expected[name]:
                  raise SystemExit(f"reviewed authorization-ordering {name} identity drift: {actual}")
          if git("rev-parse", f"{base}:database/migrations") != git("rev-parse", f"{head}:database/migrations"):
              raise SystemExit("reviewed authorization-ordering enclosing migration tree drift")
          status = git("diff", "--name-status", base, head).splitlines()
          expected_status = [
              f"M\t{paths[0]}", f"M\t{paths[1]}", f"A\t{paths[2]}",
              f"A\t{paths[3]}", f"M\t{paths[4]}",
          ]
          if status != expected_status:
              raise SystemExit(f"authorization-ordering path/status drift: {status!r}")
          fingerprint = hashlib.sha256(("\n".join(paths) + "\n").encode()).hexdigest()
          if fingerprint != expected["manifest"]:
              raise SystemExit(f"authorization-ordering manifest drift: {fingerprint}")
          for path, blob in blobs.items():
              if git("rev-parse", f"{head}:{path}") != blob:
                  raise SystemExit(f"authorization-ordering blob drift: {path}")
          forbidden = (
              ".github/", "database/migrations/", ".secrets.baseline", "pyproject.toml",
              "uv.lock", "AYO-Mobile/", "docs/", "BACKEND/courier_dispatch/",
              "BACKEND/custody/", "BACKEND/authorization/registry.py",
          )
          if any(path.startswith(forbidden) for path in paths):
              raise SystemExit("authorization-ordering candidate contains forbidden drift")
          approval = (
              "Ibrahim Hambentu Shibiru", "Founder & CEO",
              "courier-pickup-authorization-ordering", head, expected["tests"],
          )
          print("Exact Founder & CEO approval binding:", approval)
          print("Courier Pickup authorization-ordering candidate identity: PASS")
          print("Courier Pickup authorization-ordering manifest fingerprint:", fingerprint)
          PY

      - name: Verify lock file is current
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv lock --check

      - name: Check formatting
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked ruff format --check .

      - name: Lint
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked ruff check .

      - name: Verify exact historical non-PostgreSQL debt
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true' && steps.evidence_contract.outputs.mode == 'pre-batch2'
        run: |
          set +e
          uv run --locked pytest --no-cov -q --junitxml=historical-nonpostgresql.xml \
            tests/test_app.py::test_openapi_preserves_current_route_inventory \
            tests/test_migration_foundation.py::test_migration_history_has_one_expected_head \
            tests/test_ride_flow.py::test_complete_current_ride_happy_path \
            tests/test_ride_flow.py::test_invalid_transition_remains_rejected
          pytest_status=$?
          set -e
          PYTEST_STATUS="$pytest_status" uv run --locked python - <<'PY'
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          expected = {
              "tests/test_app.py::test_openapi_preserves_current_route_inventory": "legacy_routes",
              "tests/test_migration_foundation.py::test_migration_history_has_one_expected_head": "legacy_head",
              "tests/test_ride_flow.py::test_complete_current_ride_happy_path": "legacy_404",
              "tests/test_ride_flow.py::test_invalid_transition_remains_rejected": "legacy_ride_id",
          }

          def node_id(case):
              return f"{case.get('classname').replace('.', '/')}.py::{case.get('name')}"

          def signature(text):
              if "Extra items in the right set" in text and "/api/driver-offers/decline" in text:
                  return "legacy_routes"
              if "['20260724_0056']" in text and "['20260717_0020']" in text:
                  return "legacy_head"
              if "assert 404 == 200" in text:
                  return "legacy_404"
              if "KeyError: 'ride_id'" in text:
                  return "legacy_ride_id"
              return "unrecognized"

          cases = ET.parse("historical-nonpostgresql.xml").getroot().findall(".//testcase")
          actual = {}
          for case in cases:
              failure = case.find("failure")
              error = case.find("error")
              skipped = case.find("skipped")
              if failure is None and error is None:
                  raise SystemExit(f"unexpected pass or skip: {node_id(case)}")
              if skipped is not None:
                  raise SystemExit(f"unexpected skip: {node_id(case)}")
              diagnostic = failure if failure is not None else error
              text = " ".join((diagnostic.get("message", ""), diagnostic.text or ""))
              actual[node_id(case)] = signature(text)

          if int(os.environ["PYTEST_STATUS"]) != 1:
              raise SystemExit("focused pytest status was not the expected test-failure status 1")
          if actual != expected:
              raise SystemExit(f"historical non-PostgreSQL inventory drift: {actual!r}")
          normalized = "\n".join(f"{node}|{actual[node]}" for node in sorted(actual))
          fingerprint = hashlib.sha256(normalized.encode()).hexdigest()
          expected_fingerprint = "5277fff334e52230b4e9291bd5fe38d112316714b4603db5f6e9d3763c6d9346"
          if fingerprint != expected_fingerprint:
              raise SystemExit(f"historical non-PostgreSQL diagnostic fingerprint drift: {fingerprint}")
          print(normalized)
          print("Historical non-PostgreSQL diagnostic fingerprint:", fingerprint)
          PY

      - name: Resolve trusted comparison base
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        id: trusted_comparison_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          DISPATCH_BASE_SHA: ${{ inputs.expected_base_sha || '' }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          checked_out_head="$(git rev-parse HEAD)"

          require_commit() {
            local sha="$1"
            local label="$2"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" == "$zero" ]]; then
              echo "$label is absent, malformed, or all-zero: $sha" >&2
              exit 1
            fi
            git cat-file -e "$sha^{commit}" 2>/dev/null || {
              echo "$label does not identify an available commit: $sha" >&2
              exit 1
            }
          }

          case "$EVENT_NAME" in
            pull_request)
              require_commit "$PR_BASE_SHA" "pull-request base SHA"
              require_commit "$PR_HEAD_SHA" "pull-request head SHA"
              git merge-base --is-ancestor "$PR_BASE_SHA" "$checked_out_head" || {
                echo "pull-request base is not an ancestor of the tested merge tree" >&2
                exit 1
              }
              git merge-base --is-ancestor "$PR_HEAD_SHA" "$checked_out_head" || {
                echo "pull-request head is not an ancestor of the tested merge tree" >&2
                exit 1
              }
              comparison_sha="$PR_BASE_SHA"
              mode=pull-request-base
              ;;
            push)
              require_commit "$EVENT_HEAD_SHA" "pushed head SHA"
              if [[ "$checked_out_head" != "$EVENT_HEAD_SHA" ]]; then
                echo "checked-out head does not equal the pushed head" >&2
                exit 1
              fi
              if [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "$zero" ]]; then
                require_commit "$EVENT_BEFORE" "push before SHA"
                git merge-base --is-ancestor "$EVENT_BEFORE" "$EVENT_HEAD_SHA" || {
                  echo "push before SHA is not an ancestor of the pushed head" >&2
                  exit 1
                }
                comparison_sha="$EVENT_BEFORE"
                mode=verified-push-before
              else
                mapfile -t parents < <(git show -s --format='%P' "$EVENT_HEAD_SHA" | tr ' ' '\n')
                if [[ "${#parents[@]}" -ne 1 ]]; then
                  echo "first branch push must contain one unambiguous parent" >&2
                  exit 1
                fi
                first_parent="${parents[0]}"
                require_commit "$first_parent" "first-push parent SHA"
                git merge-base --is-ancestor "$first_parent" "$EVENT_HEAD_SHA" || {
                  echo "first-push parent is not an ancestor of the pushed head" >&2
                  exit 1
                }
                git fetch --no-tags origin \
                  refs/heads/main:refs/remotes/origin/coverage-main
                authoritative_main="$(git rev-parse refs/remotes/origin/coverage-main)"
                require_commit "$authoritative_main" "authoritative remote main SHA"
                merge_base="$(git merge-base "$EVENT_HEAD_SHA" "$authoritative_main")"
                if [[ "$first_parent" != "$merge_base" ]]; then
                  echo "first-push parent differs from merge-base with authoritative main" >&2
                  exit 1
                fi
                if [[ "$first_parent" != "$authoritative_main" ]]; then
                  echo "first-push parent is not the authoritative main SHA" >&2
                  exit 1
                fi
                comparison_sha="$first_parent"
                mode=verified-first-push-parent
              fi
              ;;
            workflow_dispatch)
              require_commit "$DISPATCH_BASE_SHA" "dispatch base SHA"
              require_commit "$EVENT_HEAD_SHA" "dispatch workflow source SHA"
              if [[ "$DISPATCH_BASE_SHA" != "$EVENT_HEAD_SHA" ]]; then
                echo "dispatch base differs from the trusted workflow source SHA" >&2
                exit 1
              fi
              mapfile -t parents < <(git show -s --format='%P' "$checked_out_head" | tr ' ' '\n')
              if [[ "${#parents[@]}" -ne 2 || "${parents[0]}" != "$DISPATCH_BASE_SHA" ]]; then
                echo "dispatch target first parent differs from the verified dispatch base" >&2
                exit 1
              fi
              comparison_sha="$DISPATCH_BASE_SHA"
              mode=certified-dispatch-base
              ;;
            *)
              echo "unsupported event for coverage comparison: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          require_commit "$comparison_sha" "resolved trusted comparison base"
          git merge-base --is-ancestor "$comparison_sha" "$checked_out_head" || {
            echo "resolved trusted comparison base is not an ancestor of the tested tree" >&2
            exit 1
          }
          echo "sha=$comparison_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Trusted comparison mode: $mode"
          echo "Trusted comparison base SHA: $comparison_sha"

      - name: Bind exact Booking replay-equivalence candidate identity
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true' && steps.evidence_contract.outputs.mode == 'booking-complete-replay-equivalence'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TRUSTED_COMPARISON_BASE_SHA: ${{ steps.trusted_comparison_base.outputs.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          expected_base=b79c7ae45f644dd1198f0b526bbda38bc2d11e23
          expected_tests=a54dc4b68b6f1882d5f81e247460d3e4ffbab062
          case "$EVENT_NAME" in
            pull_request)
              candidate="$PR_HEAD_SHA"
              if [[ "$TRUSTED_COMPARISON_BASE_SHA" != "$expected_base" ]]; then
                echo "Booking replay-equivalence PR base identity drift" >&2
                exit 1
              fi
              ;;
            push)
              candidate="$EVENT_HEAD_SHA"
              if [[ ! "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ \
                || "$EVENT_BEFORE" == "$zero" ]]; then
                echo "Booking replay-equivalence push predecessor is absent, malformed, or all-zero" >&2
                exit 1
              fi
              git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null || {
                echo "Booking replay-equivalence push predecessor is unavailable" >&2
                exit 1
              }
              if [[ "$TRUSTED_COMPARISON_BASE_SHA" != "$EVENT_BEFORE" ]]; then
                echo "Booking replay-equivalence push predecessor identity drift" >&2
                exit 1
              fi
              git merge-base --is-ancestor "$EVENT_BEFORE" "$candidate" || {
                echo "Booking replay-equivalence push predecessor is not an ancestor" >&2
                exit 1
              }
              ;;
            workflow_dispatch)
              candidate="$EVENT_HEAD_SHA"
              if [[ "$TRUSTED_COMPARISON_BASE_SHA" != "$expected_base" ]]; then
                echo "Booking replay-equivalence dispatch base identity drift" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported Booking replay-equivalence event" >&2
              exit 1
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Booking replay-equivalence candidate identity is absent or malformed" >&2
            exit 1
          fi
          git cat-file -e "$candidate^{commit}" 2>/dev/null || {
            echo "Booking replay-equivalence candidate commit is unavailable" >&2
            exit 1
          }
          git cat-file -e "$expected_base^{commit}" 2>/dev/null || {
            echo "Booking replay-equivalence governed base is unavailable" >&2
            exit 1
          }
          git merge-base --is-ancestor "$expected_base" "$candidate" || {
            echo "Booking replay-equivalence candidate does not descend from its base" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$expected_base" "$candidate")
          expected=(
            .github/workflows/ci.yml
            BACKEND/booking/application.py
            BACKEND/persistence/booking_repository.py
            tests/integration/test_dispatch_handoff_localization.py
            tests/test_booking_contract.py
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Booking replay-equivalence manifest drift: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${candidate}:tests")" != "$expected_tests" ]]; then
            echo "Booking replay-equivalence tests tree drift" >&2
            exit 1
          fi
          for path in database/migrations BACKEND/persistence/tables.py \
            pyproject.toml uv.lock .secrets.baseline AYO-Mobile; do
            if [[ "$(git rev-parse "${expected_base}:$path")" \
              != "$(git rev-parse "${candidate}:$path")" ]]; then
              echo "Booking replay-equivalence immutable boundary drift: $path" >&2
              exit 1
            fi
          done
          echo "Booking replay-equivalence exact candidate identity: PASS"

      - name: Bind tested Courier Pickup tree to trusted authoritative base
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true' && steps.evidence_contract.outputs.mode == 'courier-pickup-idempotency-v1'
        id: courier_pickup_v1_content
        env:
