          baseline = 77.56604919526268
          if totals["percent_covered"] - baseline != 0.21594564305522113:
              raise SystemExit("authorization-ordering coverage increase drift")

          compare_sha = os.environ.get("CONTENT_COMPARISON_BASE_SHA", "")
          classification = os.environ.get("CONTENT_CLASSIFICATION", "")
          if classification != "courier-pickup-authorization-ordering":
              raise SystemExit(f"authorization-ordering trusted classification drift: {classification!r}")
          if not re.fullmatch(r"[0-9a-f]{40}", compare_sha) or set(compare_sha) == {"0"}:
              raise SystemExit("authorization-ordering trusted comparison base is invalid")
          diff = subprocess.run(
              ["git", "diff", "--unified=0", compare_sha, "HEAD", "--", "BACKEND"],
              check=True, capture_output=True, text=True,
          ).stdout
          changed, path, candidate_line = {}, None, None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  path = line[6:]
              elif line.startswith("@@"):
                  match = re.search(r"\+(\d+)(?:,(\d+))?", line)
                  candidate_line = int(match.group(1)) if match else None
              elif candidate_line is not None and line.startswith("+") and not line.startswith("+++"):
                  changed.setdefault(path, set()).add(candidate_line)
                  candidate_line += 1
              elif candidate_line is not None and not line.startswith("-"):
                  candidate_line += 1
          inventory_rows, uncovered = [], []
          for changed_path, lines in sorted(changed.items()):
