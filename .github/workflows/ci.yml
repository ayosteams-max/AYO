            exit 1
          fi
          set +e
          (cd "$source_dir" && "$mypy_bin" --config-file "$mypy_config" --strict --show-column-numbers --show-error-codes BACKEND) > source-strict.txt 2>&1
          source_strict_status=$?
          "$mypy_bin" --config-file "$mypy_config" --strict --show-column-numbers --show-error-codes BACKEND > candidate-strict.txt 2>&1
          candidate_strict_status=$?
          (cd "$source_dir" && "$mypy_bin" --config-file "$mypy_config" --show-column-numbers --show-error-codes BACKEND tests) > source-configured.txt 2>&1
          source_configured_status=$?
          "$mypy_bin" --config-file "$mypy_config" --show-column-numbers --show-error-codes BACKEND tests > candidate-configured.txt 2>&1
          candidate_configured_status=$?
          set -e
          SOURCE_DIR="$source_dir" "$mypy_python" - <<'PY'
          from collections import Counter
          from dataclasses import dataclass
          import hashlib
          import os
          import re
          from pathlib import Path

          pattern = re.compile(
              r"^(?P<path>(?:BACKEND|tests)/.*?):(?P<line>\d+):(?P<column>\d+): "
              r"error: (?P<message>.+) \[(?P<code>[a-z0-9-]+)\]$"
          )

          @dataclass(frozen=True, order=True)
          class Diagnostic:
              path: str
              line: int
              column: int
              code: str
              message: str

              def render(self):
                  return (
                      f"{self.path}:{self.line}:{self.column}: error: "
                      f"{self.message} [{self.code}]"
                  )

          def normalized(path):
              roots = {
                  os.environ["SOURCE_DIR"].replace("\\", "/").rstrip("/") + "/",
                  str(Path.cwd()).replace("\\", "/").rstrip("/") + "/",
              }
              diagnostics = []
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw.replace("\\", "/")
                  for root in roots:
                      if line.startswith(root):
                          line = line[len(root):]
                          break
                  match = pattern.fullmatch(line)
                  if match:
                      diagnostics.append(
                          Diagnostic(
                              match["path"],
                              int(match["line"]),
                              int(match["column"]),
                              match["code"],
                              " ".join(match["message"].split()),
                          )
                      )
              if not diagnostics:
                  raise SystemExit(f"missing actionable MyPy diagnostics in {path}")
              return sorted(diagnostics)

          def fingerprint(diagnostics):
              payload = "\n".join(item.render() for item in diagnostics)
              return hashlib.sha1(payload.encode()).hexdigest()

          def report(label, diagnostics):
              files = {item.path for item in diagnostics}
              codes = Counter(item.code for item in diagnostics)
              print(f"{label} errors/files: {len(diagnostics)} {len(files)}")
              print(f"{label} error-code distribution: {dict(sorted(codes.items()))}")
              print(f"{label} semantic fingerprint: {fingerprint(diagnostics)}")

          def compare(label, source, candidate, *, allow_test_location_drift=False):
              report(f"Source {label}", source)
              report(f"Candidate {label}", candidate)
              if source == candidate:
                  return
              source_set = set(source)
              candidate_set = set(candidate)
              source_only = sorted(source_set - candidate_set)
              candidate_only = sorted(candidate_set - source_set)
              print(f"{label} source-only diagnostics ({len(source_only)}):")
              for item in source_only:
                  print("SOURCE_ONLY|" + item.render())
              print(f"{label} candidate-only diagnostics ({len(candidate_only)}):")
              for item in candidate_only:
                  print("CANDIDATE_ONLY|" + item.render())

              source_locations = Counter(
                  (item.path, item.line, item.column) for item in source
              )
              candidate_locations = Counter(
                  (item.path, item.line, item.column) for item in candidate
              )
              source_codes = Counter((item.path, item.code) for item in source)
              candidate_codes = Counter((item.path, item.code) for item in candidate)
              print("Changed-location diagnostics:", sorted(
                  (source_locations - candidate_locations).elements()
              ), sorted((candidate_locations - source_locations).elements()))
              print("Changed-code diagnostics:", sorted(
                  (source_codes - candidate_codes).elements()
              ), sorted((candidate_codes - source_codes).elements()))

              if not allow_test_location_drift:
                  raise SystemExit(f"{label} MyPy diagnostic population changed")
              if any(not item.path.startswith("tests/") for item in source_only + candidate_only):
                  raise SystemExit(
                      "configured MyPy drift escaped the excluded historical test boundary"
                  )
              if (
                  len(source) != len(candidate)
                  or len({item.path for item in source})
                  != len({item.path for item in candidate})
              ):
                  raise SystemExit("configured MyPy historical count drift")
              if Counter(item.code for item in source) != Counter(item.code for item in candidate):
                  raise SystemExit("configured MyPy historical error-code drift")
              print(
                  "Configured MyPy differences are confined to excluded historical "
                  "test locations inherited from authoritative main"
              )

          source_strict = normalized("source-strict.txt")
          candidate_strict = normalized("candidate-strict.txt")
          compare("strict backend", source_strict, candidate_strict)
          strict_files = {item.path for item in candidate_strict}
          if len(candidate_strict) != 387 or len(strict_files) != 52:
              raise SystemExit("strict backend MyPy historical count drift")
          expected_strict_codes = {
              "no-any-return": 199,
              "no-untyped-call": 120,
              "no-untyped-def": 61,
              "redundant-cast": 4,
              "type-arg": 3,
          }
          if Counter(item.code for item in candidate_strict) != expected_strict_codes:
              raise SystemExit("strict backend MyPy error-code distribution drift")
          strict_fingerprint = fingerprint(candidate_strict)
          if strict_fingerprint != "6257a24b9c057c822e45a041519a849c471f6c48":
              raise SystemExit("strict backend MyPy governed fingerprint drift")

          source_configured = normalized("source-configured.txt")
          candidate_configured = normalized("candidate-configured.txt")
          compare(
              "configured", source_configured, candidate_configured,
              allow_test_location_drift=True,
          )
          configured_files = {item.path for item in candidate_configured}
          if len(candidate_configured) != 203 or len(configured_files) != 18:
              raise SystemExit("configured MyPy historical count drift")
          print("Batch 1 typing equivalence: PASS")
          PY
          if [[ "$source_strict_status" -eq 0 || "$candidate_strict_status" -eq 0 \
            || "$source_configured_status" -eq 0 || "$candidate_configured_status" -eq 0 ]]; then
            echo "Historical MyPy debt unexpectedly disappeared" >&2
            exit 1
          fi
          rm -rf "$source_dir" "$mypy_root" source-strict.txt candidate-strict.txt \
            source-configured.txt candidate-configured.txt

      - name: Scan exact candidate for secrets
