              "decision_log_blob": git("rev-parse", f"{CANDIDATE}:docs/AYO_DECISION_LOG.md"),
              "roadmap_blob": git("rev-parse", f"{CANDIDATE}:docs/AYO_ROADMAP.md"),
              "root_tests_tree": git("rev-parse", f"{CANDIDATE}:tests"),
              "mobile_tree": git("rev-parse", f"{CANDIDATE}:AYO-Mobile"),
              "mobile_tests_tree": git("rev-parse", f"{CANDIDATE}:AYO-Mobile/tests"),
              "backend_tree": git("rev-parse", f"{CANDIDATE}:BACKEND"),
              "migration_tree": git("rev-parse", f"{CANDIDATE}:database/migrations"),
              "package_blob": git("rev-parse", f"{CANDIDATE}:AYO-Mobile/package.json"),
              "lockfile_blob": git("rev-parse", f"{CANDIDATE}:AYO-Mobile/package-lock.json"),
              "baseline_blob": git("rev-parse", f"{CANDIDATE}:.secrets.baseline"),
          }
          if actual != EXPECTED:
              raise SystemExit("Consent architecture evidence immutable identity drift")

          architecture_path = "docs/AYO_BOOKING_CONSENT_DOCUMENT_DELIVERY_CONTRACT_ARCHITECTURE.md"
          decision_path = "docs/AYO_DECISION_LOG.md"
          roadmap_path = "docs/AYO_ROADMAP.md"

          def committed_blob(commit, path, expected_blob):
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise ValueError("Consent architecture committed candidate identity is malformed")
              listing = subprocess.run(
                  ["git", "ls-tree", commit, "--", path], check=True,
                  capture_output=True, text=True,
              ).stdout.rstrip("\n")
              match = re.fullmatch(r"100644 blob ([0-9a-f]{40})\t" + re.escape(path), listing)
