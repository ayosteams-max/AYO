          uv run --locked python - <<'PY'
          import psycopg

          admin = dict(
              host="127.0.0.1",
              dbname="postgres",
              user="ayo_test",
              password="ayo_test_password",
              autocommit=True,
          )
          with psycopg.connect(**admin) as connection:
              database_count = connection.execute(
                  "SELECT count(*) FROM pg_database WHERE datname = 'ayo_roundtrip'"
              ).fetchone()[0]
              connection_count = connection.execute(
                  "SELECT count(*) FROM pg_stat_activity WHERE datname = 'ayo_roundtrip'"
              ).fetchone()[0]
              if database_count or connection_count:
                  raise SystemExit(
                      "Round-trip isolation was contaminated before migration debt: "
                      f"databases={database_count}, connections={connection_count}"
                  )
              connection.execute("DROP ROLE IF EXISTS ayo_runtime")
              connection.execute("CREATE ROLE ayo_runtime NOLOGIN")
              role_count = connection.execute(
                  "SELECT count(*) FROM pg_roles WHERE rolname = 'ayo_runtime'"
              ).fetchone()[0]
              if role_count != 1:
                  raise SystemExit("ayo_runtime lifecycle reset did not fail closed")
              print("Historical migration round-trip isolation: PASS")
              print("ayo_runtime lifecycle reset: PASS")
          PY
          set +e
          set -o pipefail
          uv run --locked pytest -m migration --no-cov -q \
            --junitxml=historical-migrations.xml 2>&1 | tee historical-migrations.log
          pytest_status=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          PYTEST_STATUS="$pytest_status" uv run --locked python - <<'PY'
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          prefix = "tests/integration/test_migrations.py::"
          expected_failures = {
              prefix + "test_upgrade_empty_database_matches_metadata_and_postgresql_17": "obsolete_table_inventory",
              prefix + "test_repeated_upgrade_preserves_data": "missing_ayo_runtime",
              prefix + "test_concurrent_deployments_serialize_safely": "missing_ayo_runtime",
              prefix + "test_failed_run_releases_lock_and_recovery_succeeds": "missing_ayo_runtime",
              prefix + "test_dispatch_migration_is_reversible_before_activation": "missing_ayo_runtime",
              prefix + "test_scheduled_dispatch_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_active_ride_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_driver_trust_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_canonical_ride_request_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_dispatch_handoff_localization_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_active_ride_lifecycle_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_pricing_foundation_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_ledger_foundation_migration_is_reversible": "missing_ayo_runtime",
          }
          expected_passes = {
              prefix + "test_runtime_role_has_append_read_but_not_mutation_privileges",
              prefix + "test_migration_lock_has_bounded_wait",
          }

          def node_id(case):
              return f"{case.get('classname').replace('.', '/')}.py::{case.get('name')}"

          def signature(text):
              if (
                  "Extra items in the left set" in text
                  and "AssertionError" in text
              ):
                  return "obsolete_table_inventory"
              if 'role "ayo_runtime" does not exist' in text:
                  return "missing_ayo_runtime"
              return "unrecognized"

          failures = {}
          passes = set()
          cases = ET.parse("historical-migrations.xml").getroot().findall(".//testcase")
          for case in cases:
              node = node_id(case)
              failure = case.find("failure")
              error = case.find("error")
              skipped = case.find("skipped")
              if skipped is not None:
                  raise SystemExit(f"unexpected migration skip: {node}")
              if failure is None and error is None:
                  passes.add(node)
                  continue
              diagnostic = failure if failure is not None else error
              text = " ".join((diagnostic.get("message", ""), diagnostic.text or ""))
              failures[node] = signature(text)

          if int(os.environ["PYTEST_STATUS"]) != 1:
              raise SystemExit("migration pytest status was not the expected test-failure status 1")
          if failures != expected_failures or passes != expected_passes:
              raise SystemExit(f"historical migration inventory drift: failures={failures!r}, passes={passes!r}")
          if len(failures) != 13 or len(passes) != 2:
              raise SystemExit("historical migration result is not exactly 13 failed / 2 passed")
          log = open("historical-migrations.log", encoding="utf-8").read()
          if "298 deselected" not in log:
              raise SystemExit("historical migration deselection inventory is not exactly 298")
          normalized = "\n".join(
              [*(f"FAIL|{node}|{failures[node]}" for node in sorted(failures)),
               *(f"PASS|{node}" for node in sorted(passes))]
          )
          fingerprint = hashlib.sha256(normalized.encode()).hexdigest()
          expected_fingerprint = "0d3e18559688ecede5780930527df2a4626046d6db28d8883eee736bef93f59a"
          if fingerprint != expected_fingerprint:
              raise SystemExit(f"historical migration diagnostic fingerprint drift: {fingerprint}")
          print(normalized)
          print("Historical migration diagnostic fingerprint:", fingerprint)
          PY
          echo "Historical migration debt contract matched"

