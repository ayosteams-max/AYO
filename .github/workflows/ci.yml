      - name: Remove Mobile Booking backend regression intermediates
        if: always() && steps.evidence_contract.outputs.mode == 'mobile-booking-intent-foundation'
        env:
          BROAD_REGRESSION_OUTCOME: ${{ steps.backend_broad_regression.outcome }}
        run: |
          set -euo pipefail
          repository_root="$(pwd -P)"
          targets=(
            batch1-coverage.json
            batch1-deselections.txt
            pytest-results.xml
            batch1-coverage.log
          )
          for relative in "${targets[@]}"; do
            target="$repository_root/$relative"
            [[ "$(dirname -- "$target")" == "$repository_root" ]] || {
              echo "Mobile Booking backend-intermediate parent drift" >&2; exit 1; }
            if [[ "$BROAD_REGRESSION_OUTCOME" == "success" \
              && ! -e "$target" && ! -L "$target" ]]; then
              echo "Mobile Booking backend-intermediate missing after successful producer" >&2
              exit 1
            fi
            if [[ -L "$target" ]]; then
              rm -- "$target"
            elif [[ -e "$target" ]]; then
              [[ -f "$target" ]] || {
                echo "Mobile Booking backend-intermediate is not a regular file" >&2; exit 1; }
              rm -- "$target"
            elif [[ "$BROAD_REGRESSION_OUTCOME" != "failure" \
              && "$BROAD_REGRESSION_OUTCOME" != "skipped" ]]; then
              echo "Mobile Booking backend-intermediate producer outcome drift" >&2
              exit 1
            fi
