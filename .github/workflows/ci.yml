name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: ayo_test
          POSTGRES_PASSWORD: ayo_test_password
          POSTGRES_USER: ayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayo_test -d ayo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AYO_TEST_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_test
      DEBUG: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lock file is current
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Test
        run: uv run --locked pytest --junitxml=pytest-results.xml

      - name: Report test failures
        if: failure() && hashFiles('pytest-results.xml') != ''
        run: >-
          python -c "import xml.etree.ElementTree as E;
          root=E.parse('pytest-results.xml').getroot();
          failures=root.findall('.//failure') + root.findall('.//error');
          [print('::error title=Pytest failure::' +
          ((item.text or item.get('message') or 'test failed')
          .replace('%','%25').replace('\r','%0D').replace('\n','%0A')))
          for item in failures]"

      - name: Verify PostgreSQL 17 integration tests without skips
        run: uv run --locked pytest -m integration --no-cov -q

      - name: Verify migration suite against PostgreSQL 17 without skips
        run: uv run --locked pytest -m migration --no-cov -q

      - name: Install and verify PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --silent \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17(\.|$)'

      - name: Initialize and verify canonical migration head
        env:
          AYO_DATABASE_URL: ${{ env.AYO_TEST_DATABASE_URL }}
          AYO_DATABASE_SSL_MODE: disable
          PYTHONPATH: .
        run: |
          uv run --locked python database/migrate.py
          uv run --locked python -c "
          from BACKEND.persistence.config import DatabaseSettings
          from BACKEND.persistence.engine import create_postgres_engine
          from BACKEND.persistence.migrations import SchemaVersionReadinessChecker
          engine = create_postgres_engine(DatabaseSettings(application_name='ayo-ci-schema-readiness'))
          readiness = SchemaVersionReadinessChecker(engine).check()
          engine.dispose()
          print(f'CI migration head: current={readiness.current_revision} expected={readiness.expected_revision}')
          if not readiness.ready or readiness.current_revision != readiness.expected_revision:
              raise SystemExit('CI database is not at the canonical migration head')
          "

      - name: Certify PostgreSQL backup and restore
        run: uv run --locked python database/certify_restore.py

      - name: Verify audit suite against PostgreSQL 17 without skips
        run: uv run --locked pytest -m audit --no-cov -q

      - name: Verify session persistence suite without skips
        run: uv run --locked pytest -m session_persistence --no-cov -q

      - name: Verify authentication foundation without skips
        run: uv run --locked pytest -m authentication --no-cov -q

      - name: Verify authorization foundation without skips
        run: uv run --locked pytest -m authorization --no-cov -q

      - name: Verify support foundation without skips
        run: uv run --locked pytest -m support --no-cov -q

      - name: Scan Python source
        run: >-
          uv run --locked bandit -c pyproject.toml -r
          BACKEND ayo.py database/certify_restore.py

      - name: Audit installed dependencies
        run: uv run --locked pip-audit
