        run: |
          set -euo pipefail
          scanner_version="$(uv tool run --from 'detect-secrets==1.5.0' detect-secrets --version)"
          scan_root="$(mktemp -d)"
          git archive HEAD | tar -x -C "$scan_root"
          (
            cd "$scan_root"
