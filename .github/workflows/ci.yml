          EVENT_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=ee6650d7f6304e73c31aee8a1ab709cd3be1fbf0
          require_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ && "$1" != "$zero" ]] || { echo "$2 is absent, malformed, or all-zero" >&2; exit 1; }
            git cat-file -e "$1^{commit}" 2>/dev/null || { echo "$2 is unavailable" >&2; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request)
              require_commit "$PR_BASE_SHA" "Mobile PR base"; require_commit "$PR_HEAD_SHA" "Mobile PR head"
              [[ "$PR_BASE_SHA" == "$base" ]] || { echo "Mobile PR base drift" >&2; exit 1; }
              candidate="$PR_HEAD_SHA"
              git merge-base --is-ancestor "$base" HEAD || { echo "Mobile base is not ancestral to tested merge" >&2; exit 1; }
              git merge-base --is-ancestor "$candidate" HEAD || { echo "Mobile head is not ancestral to tested merge" >&2; exit 1; }
              ;;
            push)
              require_commit "$EVENT_HEAD_SHA" "Mobile pushed head"
              [[ "$EVENT_HEAD_SHA" == "$(git rev-parse HEAD)" ]] || { echo "Mobile pushed checkout drift" >&2; exit 1; }
              candidate="$EVENT_HEAD_SHA"
