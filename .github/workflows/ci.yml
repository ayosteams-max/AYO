              "migration": "1152223fb6fe0237745e37834fa56076b080d4d0",
          }
          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True,
              ).stdout.strip()
          head = os.environ["TESTED_HEAD_SHA"]
          predecessor = os.environ["PUBLISHED_PREDECESSOR_SHA"]
          authoritative_base = "65ff78430315c2d10bc40a0f3edafced6cec3ad2"
          if not head or not predecessor or git("merge-base", head, predecessor) != predecessor:
              raise SystemExit("Courier Pickup tested head does not preserve published ancestry")
          predecessor_descends_from_w16 = (
              git("merge-base", predecessor, authoritative_base) == authoritative_base
          )
          head_descends_from_w16 = (
              git("merge-base", head, authoritative_base) == authoritative_base
          )
          cumulative_changed = (
              git("diff", "--name-only", authoritative_base, head).splitlines()
              if head_descends_from_w16 else []
          )
          workflow_only_admission = (
              predecessor_descends_from_w16
              and head_descends_from_w16
