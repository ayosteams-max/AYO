          committed = {
              architecture_path: committed_blob(CANDIDATE, architecture_path, EXPECTED["architecture_blob"]),
              decision_path: committed_blob(CANDIDATE, decision_path, EXPECTED["decision_log_blob"]),
              roadmap_path: committed_blob(CANDIDATE, roadmap_path, EXPECTED["roadmap_blob"]),
          }
          decoded = {path: decode_document(path, data) for path, data in committed.items()}
          architecture = decoded[architecture_path]
          decision = decoded[decision_path]
