name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ayo_test
          POSTGRES_PASSWORD: ayo_test_password
          POSTGRES_USER: ayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayo_test -d ayo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AYO_TEST_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_test
      DEBUG: "true"
      TESTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BATCH1_ORIGINAL_SHA: 4e24dce178239f23abfabea7ff5a47f7ee319f68
      BATCH1_MERGE_SHA: cfd349185fa50b53f2d0f3735cf6b4d95f671e9a
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify exact Batch 1 authority
        id: batch1_authority
        run: |
          echo "historical=false" >> "$GITHUB_OUTPUT"
          if [[ "$TESTED_COMMIT_SHA" != "$BATCH1_ORIGINAL_SHA" && "$TESTED_COMMIT_SHA" != "$BATCH1_MERGE_SHA" ]]; then
            echo "Ordinary coverage authority for $TESTED_COMMIT_SHA"
            exit 0
          fi

          if [[ "$TESTED_COMMIT_SHA" == "$BATCH1_MERGE_SHA" ]]; then
            expected_main="50da03188e6995d15ba9a96c2ca08086fc0148ce"
            expected_batch1_base="4c92b1c7088d1d54c8d15e5624085d370253c2b9"
            read -ra parents <<< "$(git show -s --format=%P "$TESTED_COMMIT_SHA")"
            if [[ "${#parents[@]}" -ne 2 || "${parents[0]}" != "$BATCH1_ORIGINAL_SHA" || "${parents[1]}" != "$expected_main" ]]; then
              echo "Sanctioned Batch 1 merge-parent topology mismatch" >&2
              exit 1
            fi

            mapfile -t merge_delta < <(git diff --name-only "$BATCH1_ORIGINAL_SHA" "$TESTED_COMMIT_SHA")
            if [[ "${#merge_delta[@]}" -ne 1 || "${merge_delta[0]}" != ".github/workflows/ci.yml" ]]; then
              echo "Sanctioned Batch 1 merge changed content outside the approved workflow" >&2
              exit 1
            fi

            mapfile -t approved_manifest < <(git diff --name-only "$expected_batch1_base" "$BATCH1_ORIGINAL_SHA")
            mapfile -t candidate_manifest < <(git diff --name-only "$expected_main" "$TESTED_COMMIT_SHA")
            if [[ "${#approved_manifest[@]}" -ne 235 || "${#candidate_manifest[@]}" -ne 235 ]]; then
              echo "Batch 1 manifest count mismatch" >&2
              exit 1
            fi
            if ! diff -u <(printf '%s\n' "${approved_manifest[@]}") <(printf '%s\n' "${candidate_manifest[@]}"); then
              echo "Batch 1 manifest identity mismatch" >&2
              exit 1
            fi

            if [[ "$(git rev-parse "$TESTED_COMMIT_SHA:BACKEND")" != "5c4895867a7cbf7537158ba41fa7a5361d1ddf31" ]]; then
              echo "Batch 1 BACKEND tree mismatch" >&2
              exit 1
            fi
            declare -A migration_blobs=(
              [database/migrations/versions/20260716_0016_canonical_ride_request.py]=3c1e4b8400567b154582ffbb5f7426d933db1d23
              [database/migrations/versions/20260723_0055_courier_dispatch_increment1.py]=5f9def981c2db843e37dbd11e8b6f924f4d819fe
              [database/migrations/versions/20260724_0056_courier_pickup_increment1.py]=ba3ca02b8c2274edae02db5552fa2c0125bf0f19
            )
            for path in "${!migration_blobs[@]}"; do
              if [[ "$(git rev-parse "$TESTED_COMMIT_SHA:$path")" != "${migration_blobs[$path]}" ]]; then
                echo "Batch 1 migration blob mismatch: $path" >&2
                exit 1
              fi
            done
            if ! git diff --quiet "$BATCH1_ORIGINAL_SHA" "$TESTED_COMMIT_SHA" -- pyproject.toml uv.lock; then
              echo "Batch 1 dependency or lockfile state mismatch" >&2
              exit 1
            fi
            if [[ "$(git show "$TESTED_COMMIT_SHA:uv.lock" | awk '/^name = "cryptography"$/{getline; print; exit}')" != 'version = "50.0.0"' ]]; then
              echo "Batch 1 cryptography version mismatch" >&2
              exit 1
            fi
          fi

          echo "historical=true" >> "$GITHUB_OUTPUT"
          echo "Exact Batch 1 historical authority established for $TESTED_COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install "uv==0.11.28"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify PostgreSQL 17 and PostGIS 3.5
        id: postgis
        run: |
          uv run --locked python - <<'PY'
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              dbname="ayo_test",
              user="ayo_test",
              password="ayo_test_password",
              autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS postgis_topology CASCADE")
                  cursor.execute("DROP EXTENSION IF EXISTS fuzzystrmatch CASCADE")
                  cursor.execute("CREATE EXTENSION IF NOT EXISTS postgis")
                  cursor.execute("SHOW server_version")
                  server_version = cursor.fetchone()[0]
                  cursor.execute("SHOW server_version_num")
                  server_version_num = int(cursor.fetchone()[0])
                  cursor.execute("SELECT extversion FROM pg_extension WHERE extname = 'postgis'")
                  postgis_version = cursor.fetchone()[0]
                  cursor.execute("SELECT postgis_full_version()")
                  postgis_full_version = cursor.fetchone()[0]
                  cursor.execute("SELECT to_regtype('geometry') IS NOT NULL")
                  geometry_available = cursor.fetchone()[0]
                  cursor.execute("SELECT 1 FROM pg_roles WHERE rolname = 'ayo_runtime'")
                  if cursor.fetchone() is None:
                      cursor.execute("CREATE ROLE ayo_runtime NOLOGIN")

          print(f"PostgreSQL server version: {server_version}")
          print(f"PostGIS extension version: {postgis_version}")
          print(f"PostGIS full version: {postgis_full_version}")
          print(f"geometry type available: {geometry_available}")
          if not 170000 <= server_version_num < 180000:
              raise SystemExit("PostgreSQL server major version is not 17")
          if not postgis_version.startswith("3.5"):
              raise SystemExit("PostGIS extension is not on the approved 3.5 line")
          if not geometry_available:
              raise SystemExit("PostGIS geometry type is unavailable")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify lock file is current
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv lock --check

      - name: Check formatting
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked ruff format --check .

      - name: Lint
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked ruff check .

      - name: Verify exact historical non-PostgreSQL debt
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: |
          if [[ "${{ steps.batch1_authority.outputs.historical }}" != "true" ]]; then
            uv run --locked pytest --no-cov -q \
              tests/test_app.py::test_openapi_preserves_current_route_inventory \
              tests/test_migration_foundation.py::test_migration_history_has_one_expected_head \
              tests/test_ride_flow.py::test_complete_current_ride_happy_path \
              tests/test_ride_flow.py::test_invalid_transition_remains_rejected
            exit 0
          fi
          set +e
          uv run --locked pytest --no-cov -q --junitxml=historical-nonpostgresql.xml \
            tests/test_app.py::test_openapi_preserves_current_route_inventory \
            tests/test_migration_foundation.py::test_migration_history_has_one_expected_head \
            tests/test_ride_flow.py::test_complete_current_ride_happy_path \
            tests/test_ride_flow.py::test_invalid_transition_remains_rejected
          pytest_status=$?
          set -e
          PYTEST_STATUS="$pytest_status" uv run --locked python - <<'PY'
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          expected = {
              "tests/test_app.py::test_openapi_preserves_current_route_inventory": "legacy_routes",
              "tests/test_migration_foundation.py::test_migration_history_has_one_expected_head": "legacy_head",
              "tests/test_ride_flow.py::test_complete_current_ride_happy_path": "legacy_404",
              "tests/test_ride_flow.py::test_invalid_transition_remains_rejected": "legacy_ride_id",
          }

          def node_id(case):
              return f"{case.get('classname').replace('.', '/')}.py::{case.get('name')}"

          def signature(text):
              if "Extra items in the right set" in text and "/api/driver-offers/decline" in text:
                  return "legacy_routes"
              if "['20260724_0056']" in text and "['20260717_0020']" in text:
                  return "legacy_head"
              if "assert 404 == 200" in text:
                  return "legacy_404"
              if "KeyError: 'ride_id'" in text:
                  return "legacy_ride_id"
              return "unrecognized"

          cases = ET.parse("historical-nonpostgresql.xml").getroot().findall(".//testcase")
          actual = {}
          for case in cases:
              failure = case.find("failure")
              error = case.find("error")
              skipped = case.find("skipped")
              if failure is None and error is None:
                  raise SystemExit(f"unexpected pass or skip: {node_id(case)}")
              if skipped is not None:
                  raise SystemExit(f"unexpected skip: {node_id(case)}")
              diagnostic = failure if failure is not None else error
              text = " ".join((diagnostic.get("message", ""), diagnostic.text or ""))
              actual[node_id(case)] = signature(text)

          if int(os.environ["PYTEST_STATUS"]) != 1:
              raise SystemExit("focused pytest status was not the expected test-failure status 1")
          if actual != expected:
              raise SystemExit(f"historical non-PostgreSQL inventory drift: {actual!r}")
          normalized = "\n".join(f"{node}|{actual[node]}" for node in sorted(actual))
          fingerprint = hashlib.sha256(normalized.encode()).hexdigest()
          expected_fingerprint = "5277fff334e52230b4e9291bd5fe38d112316714b4603db5f6e9d3763c6d9346"
          if fingerprint != expected_fingerprint:
              raise SystemExit(f"historical non-PostgreSQL diagnostic fingerprint drift: {fingerprint}")
          print(normalized)
          print("Historical non-PostgreSQL diagnostic fingerprint:", fingerprint)
          PY

      - name: Test all admitted non-PostgreSQL behavior with coverage
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: |
          if [[ "${{ steps.batch1_authority.outputs.historical }}" != "true" ]]; then
            uv run --locked pytest --junitxml=pytest-results.xml \
              --ignore=tests/integration/test_migrations.py
            exit 0
          fi

          set +e
          set -o pipefail
          deselections=(
            --deselect=tests/test_app.py::test_openapi_preserves_current_route_inventory
            --deselect=tests/test_migration_foundation.py::test_migration_history_has_one_expected_head
            --deselect=tests/test_ride_flow.py::test_complete_current_ride_happy_path
            --deselect=tests/test_ride_flow.py::test_invalid_transition_remains_rejected
          )
          printf '%s\n' "${deselections[@]#--deselect=}" > batch1-deselections.txt
          uv run --locked pytest --junitxml=pytest-results.xml \
            --cov-report=json:batch1-coverage.json \
            --ignore=tests/integration/test_migrations.py \
            "${deselections[@]}" \
            2>&1 | tee batch1-coverage.log
          pytest_status=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          PYTEST_STATUS="$pytest_status" uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          approved_shas = {
              "4e24dce178239f23abfabea7ff5a47f7ee319f68",
              "cfd349185fa50b53f2d0f3735cf6b4d95f671e9a",
          }
          approved_tree = "5c4895867a7cbf7537158ba41fa7a5361d1ddf31"
          approved_fingerprint = "a9d406113b3fa3ebf75fe6d6b3ce7ddd8011e8d5ff0ee807f971e1499634b2ac"
          expected_deselections = {
              "tests/test_app.py::test_openapi_preserves_current_route_inventory",
              "tests/test_migration_foundation.py::test_migration_history_has_one_expected_head",
              "tests/test_ride_flow.py::test_complete_current_ride_happy_path",
              "tests/test_ride_flow.py::test_invalid_transition_remains_rejected",
          }
          expected_zero_coverage = {
              "BACKEND/active_ride/streaming.py",
              "BACKEND/active_ride/verification.py",
              "BACKEND/audit/contracts.py",
              "BACKEND/customer_profile/models.py",
              "BACKEND/customer_profile/service.py",
              "BACKEND/eat_availability/application.py",
              "BACKEND/identity/access_models.py",
              "BACKEND/identity/account_access_service.py",
              "BACKEND/identity/compatibility_models.py",
              "BACKEND/identity/compatibility_service.py",
              "BACKEND/identity/contracts.py",
              "BACKEND/identity/legacy_inventory.py",
              "BACKEND/merchant_orders/decision_application.py",
              "BACKEND/persistence/account_access_repository.py",
              "BACKEND/persistence/concurrency.py",
              "BACKEND/persistence/customer_profile_repository.py",
              "BACKEND/persistence/identity_compatibility_repository.py",
              "BACKEND/persistence/kernel.py",
              "BACKEND/persistence/kernel_models.py",
              "BACKEND/persistence/kernel_repository.py",
              "BACKEND/persistence/request_access_repository.py",
              "BACKEND/persistence/service_area_repository.py",
              "BACKEND/persistence/trace.py",
              "BACKEND/pricing/booking.py",
              "BACKEND/pricing/contracts.py",
              "BACKEND/rate_limit/contracts.py",
              "BACKEND/request_access/application.py",
              "BACKEND/request_access/models.py",
              "BACKEND/ride_request/mobility_application.py",
              "BACKEND/service_area/application.py",
              "BACKEND/service_area/engine.py",
              "BACKEND/service_area/models.py",
              "BACKEND/session/contracts.py",
              "BACKEND/support/contracts.py",
          }
          expected_uncollected = {
              "BACKEND/financial_control/application.py",
              "BACKEND/financial_control/authorization.py",
              "BACKEND/financial_control/composition.py",
              "BACKEND/financial_control/registry.py",
              "BACKEND/financial_control/repository.py",
              "BACKEND/financial_posting/application.py",
              "BACKEND/financial_posting/authorization.py",
              "BACKEND/financial_posting/composition.py",
              "BACKEND/financial_posting/registry.py",
              "BACKEND/financial_posting/repository.py",
              "BACKEND/payment/application.py",
              "BACKEND/refund/application.py",
              "BACKEND/refund/authorization.py",
              "BACKEND/refund/composition.py",
              "BACKEND/refund/registry.py",
              "BACKEND/refund/repository.py",
              "BACKEND/settlement/application.py",
              "BACKEND/settlement/authorization.py",
              "BACKEND/settlement/composition.py",
              "BACKEND/settlement/registry.py",
              "BACKEND/settlement/repository.py",
              "BACKEND/wallet/composition.py",
              "BACKEND/wallet/registry.py",
              "BACKEND/wallet/repository.py",
          }
          expected_preexisting_uncollected = {
              "BACKEND/models/ride.py",
              "BACKEND/routes/driver_offer.py",
              "BACKEND/routes/ride.py",
              "BACKEND/routes/ride_status.py",
              "BACKEND/routes/wallet.py",
              "BACKEND/services/ayo_ai.py",
              "BACKEND/services/ride_store.py",
          }

          tested_sha = os.environ["TESTED_COMMIT_SHA"]
          if tested_sha not in approved_shas:
              raise SystemExit(f"Batch 1 coverage authority absent for SHA {tested_sha}")
          backend_tree = subprocess.run(
              ["git", "rev-parse", "HEAD:BACKEND"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if backend_tree != approved_tree:
              raise SystemExit(f"Batch 1 BACKEND tree drift: {backend_tree}")
          if int(os.environ["PYTEST_STATUS"]) != 1:
              raise SystemExit("ordinary 70% coverage command did not fail with status 1")

          junit = ET.parse("pytest-results.xml").getroot()
          cases = junit.findall(".//testcase")
          failures = [case for case in cases if case.find("failure") is not None]
          errors = [case for case in cases if case.find("error") is not None]
          skipped_cases = [case for case in cases if case.find("skipped") is not None]
          xfailed = []
          skipped = []
          for case in skipped_cases:
              item = case.find("skipped")
              diagnostic = " ".join((item.get("type", ""), item.get("message", ""))).lower()
              (xfailed if "xfail" in diagnostic else skipped).append(case)
          passed = len(cases) - len(failures) - len(errors) - len(skipped_cases)
          actual_inventory = {
              "passed": passed,
              "failed": len(failures),
              "errors": len(errors),
              "skipped": len(skipped),
              "xfailed": len(xfailed),
          }
          expected_inventory = {
              "passed": 293,
              "failed": 0,
              "errors": 0,
              "skipped": 0,
              "xfailed": 1,
          }
          if actual_inventory != expected_inventory:
              raise SystemExit(f"Batch 1 test inventory drift: {actual_inventory!r}")

          log = open("batch1-coverage.log", encoding="utf-8").read()
          if "4 deselected" not in log:
              raise SystemExit("Batch 1 exact four-test deselection count disappeared")
          if "FAIL Required test coverage of 70% not reached" not in log:
              raise SystemExit("ordinary 70% threshold was not the sole reported failure")

          coverage = json.load(open("batch1-coverage.json", encoding="utf-8"))
          totals = coverage["totals"]
          actual_totals = (
              totals["num_statements"],
              totals["missing_lines"],
              f'{totals["percent_covered"]:.8f}',
          )
          if actual_totals != (20835, 7969, "56.38838839"):
              raise SystemExit(f"Batch 1 coverage totals drift: {actual_totals!r}")

          normalized = []
          collected = set()
          for path, evidence in sorted(coverage["files"].items()):
              path = path[path.find("BACKEND/"):]
              collected.add(path)
              normalized.append([
                  path,
                  evidence["summary"],
                  evidence.get("executed_lines", []),
                  evidence.get("missing_lines", []),
                  evidence.get("executed_branches", []),
                  evidence.get("missing_branches", []),
              ])
          fingerprint = hashlib.sha256(
              json.dumps(normalized, separators=(",", ":"), sort_keys=True).encode()
          ).hexdigest()
          if fingerprint != approved_fingerprint:
              raise SystemExit(f"Batch 1 semantic coverage fingerprint drift: {fingerprint}")

          zero_coverage = {
              path[path.find("BACKEND/"):]
              for path, evidence in coverage["files"].items()
              if evidence["summary"]["num_statements"]
              and evidence["summary"]["covered_lines"] == 0
          }
          if zero_coverage != expected_zero_coverage:
              raise SystemExit(f"Batch 1 zero-coverage inventory drift: {sorted(zero_coverage)!r}")
          tracked_python = set(
              subprocess.run(
                  ["git", "ls-files", "BACKEND/**/*.py"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
          )
          uncollected = tracked_python - collected
          if uncollected != expected_uncollected | expected_preexisting_uncollected:
              raise SystemExit(f"Batch 1 uncollected-file inventory drift: {sorted(uncollected)!r}")
          actual_deselections = set(
              open("batch1-deselections.txt", encoding="utf-8").read().splitlines()
          )
          if actual_deselections != expected_deselections:
              raise SystemExit(f"Batch 1 governed deselection drift: {sorted(actual_deselections)!r}")

          print("Batch 1 tested SHA:", tested_sha)
          print("Batch 1 BACKEND tree:", backend_tree)
          print("Batch 1 test inventory:", actual_inventory, "deselected=4")
          print("Batch 1 coverage totals:", actual_totals)
          print("Batch 1 semantic coverage fingerprint:", fingerprint)
          print("Batch 1 zero-coverage modules:", len(zero_coverage))
          print("Batch 1 historically uncollected checkpoint files:", len(expected_uncollected))
          print("Batch 1 total uncollected files including baseline debt:", len(uncollected))
          print("One-time Batch 1 historical coverage contract matched")
          PY

      - name: Verify PostgreSQL 17/PostGIS integration tests without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m "integration and not migration" --no-cov -q

      - name: Install and verify PostgreSQL 17 client
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        id: pg_client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --silent \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17(\.|$)'
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Initialize and verify canonical migration head
        if: (success() || failure()) && steps.pg_client.outputs.ready == 'true'
        id: canonical_schema
        env:
          AYO_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_certification
          AYO_DATABASE_SSL_MODE: disable
          PYTHONPATH: .
        run: |
          uv run --locked python - <<'PY'
          import psycopg

          with psycopg.connect(
              host="127.0.0.1", dbname="postgres", user="ayo_test",
              password="ayo_test_password", autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("DROP DATABASE IF EXISTS ayo_certification")
                  cursor.execute("CREATE DATABASE ayo_certification")
          with psycopg.connect(
              host="127.0.0.1", dbname="ayo_certification", user="ayo_test",
              password="ayo_test_password", autocommit=True,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE EXTENSION IF NOT EXISTS postgis")
                  cursor.execute("SELECT postgis_full_version(), to_regtype('geometry') IS NOT NULL")
                  print("Certification database PostGIS evidence:", cursor.fetchone())
          PY
          uv run --locked python database/migrate.py
          uv run --locked python -c "
          from BACKEND.persistence.config import DatabaseSettings
          from BACKEND.persistence.engine import create_postgres_engine
          from BACKEND.persistence.migrations import SchemaVersionReadinessChecker
          engine = create_postgres_engine(DatabaseSettings(application_name='ayo-ci-schema-readiness'))
          readiness = SchemaVersionReadinessChecker(engine).check()
          engine.dispose()
          print(f'CI migration head: current={readiness.current_revision} expected={readiness.expected_revision}')
          if not readiness.ready or readiness.current_revision != readiness.expected_revision:
              raise SystemExit('CI database is not at the canonical migration head')
          "
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Certify PostgreSQL backup and restore
        if: (success() || failure()) && steps.canonical_schema.outputs.ready == 'true'
        env:
          AYO_TEST_DATABASE_URL: postgresql+psycopg://ayo_test:ayo_test_password@127.0.0.1:5432/ayo_certification
        run: uv run --locked python database/certify_restore.py

      - name: Verify audit suite against PostgreSQL 17/PostGIS without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m audit --no-cov -q

      - name: Verify session persistence suite without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m session_persistence --no-cov -q

      - name: Verify authentication foundation without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m authentication --no-cov -q

      - name: Verify authorization foundation without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m authorization --no-cov -q

      - name: Verify support foundation without skips
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pytest -m support --no-cov -q

      - name: Verify exact historical migration-suite debt
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: |
          uv run --locked python -c "import psycopg; connection = psycopg.connect(host='127.0.0.1', dbname='postgres', user='ayo_test', password='ayo_test_password', autocommit=True); connection.execute('DROP DATABASE IF EXISTS ayo_certification'); connection.close()"
          if [[ "${{ steps.batch1_authority.outputs.historical }}" != "true" ]]; then
            uv run --locked python -c "import psycopg; connection = psycopg.connect(host='127.0.0.1', dbname='ayo_test', user='ayo_test', password='ayo_test_password', autocommit=True); connection.execute('DROP EXTENSION IF EXISTS postgis CASCADE'); connection.close()"
            uv run --locked pytest -m migration --no-cov -q
            exit 0
          fi
          set +e
          uv run --locked pytest -m migration --no-cov -q --junitxml=historical-migrations.xml
          pytest_status=$?
          set -e
          PYTEST_STATUS="$pytest_status" uv run --locked python - <<'PY'
          import hashlib
          import os
          import xml.etree.ElementTree as ET

          prefix = "tests/integration/test_migrations.py::"
          expected_failures = {
              prefix + "test_upgrade_empty_database_matches_metadata_and_postgresql_17": "obsolete_table_inventory",
              prefix + "test_repeated_upgrade_preserves_data": "missing_ayo_runtime",
              prefix + "test_concurrent_deployments_serialize_safely": "missing_ayo_runtime",
              prefix + "test_failed_run_releases_lock_and_recovery_succeeds": "missing_ayo_runtime",
              prefix + "test_dispatch_migration_is_reversible_before_activation": "missing_ayo_runtime",
              prefix + "test_scheduled_dispatch_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_active_ride_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_driver_trust_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_canonical_ride_request_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_dispatch_handoff_localization_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_active_ride_lifecycle_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_pricing_foundation_migration_is_reversible": "missing_ayo_runtime",
              prefix + "test_ledger_foundation_migration_is_reversible": "missing_ayo_runtime",
          }
          expected_passes = {
              prefix + "test_runtime_role_has_append_read_but_not_mutation_privileges",
              prefix + "test_migration_lock_has_bounded_wait",
          }

          def node_id(case):
              return f"{case.get('classname').replace('.', '/')}.py::{case.get('name')}"

          def signature(text):
              if (
                  "Extra items in the left set" in text
                  and "AssertionError" in text
              ):
                  return "obsolete_table_inventory"
              if 'role "ayo_runtime" does not exist' in text:
                  return "missing_ayo_runtime"
              return "unrecognized"

          failures = {}
          passes = set()
          cases = ET.parse("historical-migrations.xml").getroot().findall(".//testcase")
          for case in cases:
              node = node_id(case)
              failure = case.find("failure")
              error = case.find("error")
              skipped = case.find("skipped")
              if skipped is not None:
                  raise SystemExit(f"unexpected migration skip: {node}")
              if failure is None and error is None:
                  passes.add(node)
                  continue
              diagnostic = failure if failure is not None else error
              text = " ".join((diagnostic.get("message", ""), diagnostic.text or ""))
              failures[node] = signature(text)

          if int(os.environ["PYTEST_STATUS"]) != 1:
              raise SystemExit("migration pytest status was not the expected test-failure status 1")
          if failures != expected_failures or passes != expected_passes:
              raise SystemExit(f"historical migration inventory drift: failures={failures!r}, passes={passes!r}")
          normalized = "\n".join(
              [*(f"FAIL|{node}|{failures[node]}" for node in sorted(failures)),
               *(f"PASS|{node}" for node in sorted(passes))]
          )
          fingerprint = hashlib.sha256(normalized.encode()).hexdigest()
          expected_fingerprint = "0d3e18559688ecede5780930527df2a4626046d6db28d8883eee736bef93f59a"
          if fingerprint != expected_fingerprint:
              raise SystemExit(f"historical migration diagnostic fingerprint drift: {fingerprint}")
          print(normalized)
          print("Historical migration diagnostic fingerprint:", fingerprint)
          PY
          echo "Historical migration debt contract matched"

      - name: Scan Python source
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: >-
          uv run --locked bandit -c pyproject.toml -r
          BACKEND ayo.py database/certify_restore.py

      - name: Audit installed dependencies
        if: (success() || failure()) && steps.postgis.outputs.ready == 'true'
        run: uv run --locked pip-audit
