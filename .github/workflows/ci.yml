          uv run --locked python - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          authoritative_mapping = (
              "TRUSTED_COMPARISON_BASE_SHA: " + "$" +
              "{{ steps.trusted_comparison_base.outputs.sha }}"
          )
          predecessor_mapping = (
              "PUBLISHED_PREDECESSOR_SHA: " + "$" +
              "{{ steps.trusted_comparison_base.outputs.sha }}"
          )
          resolver_id = "id: trusted_" + "comparison_base"
          if workflow.count(resolver_id) != 1:
              raise SystemExit("trusted comparison base resolver is not unique")
          if (
              workflow.count(authoritative_mapping) != 3
              or workflow.count(predecessor_mapping) != 2
          ):
              raise SystemExit("comparison-dependent gates do not share one resolver output")
          forbidden = (
              "COVERAGE_" + "COMPARE_SHA",
              "steps.coverage_" + "base.outputs.sha",
              'if compare_sha ' + '!= "4eda7c5e80907eba9b60c20d64561087ef50c84b"',
              'comparison_sha=' + '""',
              "dispatch Batch 2 target lacks " + "an exact first-parent base",
          )
          for stale in forbidden:
              if stale in workflow:
                  raise SystemExit(f"duplicated or stale comparison-base mechanism: {stale}")

          zero = "0" * 40
          prior_base = "a" * 40
          authoritative_base = "b" * 40
          head = "c" * 40
          commits = {prior_base, authoritative_base, head}

          def require_commit(value):
              if not re.fullmatch(r"[0-9a-f]{40}", value or "") or value == zero:
                  raise ValueError("invalid comparison base")
              if value not in commits:
                  raise ValueError("unavailable comparison base")

          def resolve(*, event, event_base, expected_base, first_parent, merge_base, ancestor=True):
              require_commit(event_base)
              if not ancestor:
                  raise ValueError("comparison base is not an ancestor")
              if event == "first-push" and not (
                  event_base == expected_base == first_parent == merge_base
              ):
                  raise ValueError("first-push base mismatch")
              if event == "pull-request" and event_base != expected_base:
                  raise ValueError("pull-request base mismatch")
              if event == "subsequent-push" and event_base != first_parent:
                  raise ValueError("push predecessor mismatch")
              if event == "dispatch" and event_base != first_parent:
                  raise ValueError("dispatch first-parent mismatch")
              return event_base

          def consume(resolved, supplied):
              if supplied != resolved:
                  raise ValueError("downstream trusted-base replacement")
              require_commit(supplied)
              return supplied

          valid = (
              ("first-push", authoritative_base, authoritative_base, authoritative_base, authoritative_base),
              ("pull-request", authoritative_base, authoritative_base, authoritative_base, authoritative_base),
              ("subsequent-push", authoritative_base, authoritative_base, authoritative_base, authoritative_base),
              ("dispatch", prior_base, prior_base, prior_base, prior_base),
          )
          for event, event_base, expected_base, first_parent, merge_base in valid:
              resolved = resolve(
                  event=event, event_base=event_base, expected_base=expected_base,
                  first_parent=first_parent, merge_base=merge_base,
              )
              assert consume(resolved, resolved) == event_base

          invalid = (
              ("missing trusted-base output", dict(event="pull-request", event_base="", expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
              ("malformed trusted base", dict(event="pull-request", event_base="not-a-sha", expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
              ("all-zero trusted base", dict(event="pull-request", event_base=zero, expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
              ("forged trusted base", dict(event="pull-request", event_base="f" * 40, expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
              ("wrong first-push parent", dict(event="first-push", event_base=prior_base, expected_base=authoritative_base, first_parent=prior_base, merge_base=authoritative_base)),
              ("pull-request base mismatch", dict(event="pull-request", event_base=prior_base, expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
              ("force-pushed ancestry", dict(event="subsequent-push", event_base=authoritative_base, expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base, ancestor=False)),
              ("ambiguous push predecessor", dict(event="subsequent-push", event_base=prior_base, expected_base=authoritative_base, first_parent=authoritative_base, merge_base=authoritative_base)),
          )
          for label, arguments in invalid:
              try:
                  resolve(**arguments)
              except ValueError:
                  print("NEGATIVE PASS:", label)
              else:
                  raise SystemExit(f"trusted-base negative control admitted: {label}")
          try:
              consume(authoritative_base, prior_base)
          except ValueError:
              print("NEGATIVE PASS: downstream trusted-base replacement")
          else:
              raise SystemExit("downstream replacement of trusted base was admitted")

          w16 = "65ff78430315c2d10bc40a0f3edafced6cec3ad2"
          commits.add(w16)

          def classify(*, predecessor, content_base, predecessor_is_ancestor,
                       predecessor_descends_from_w16, head_descends_from_w16,
                       changed_paths, protected_unchanged, reviewed_feature):
              require_commit(predecessor)
              require_commit(content_base)
              if not predecessor_is_ancestor:
                  raise ValueError("published predecessor is not an ancestor")
              workflow_authority = (
                  content_base == w16
                  and predecessor_descends_from_w16
                  and head_descends_from_w16
                  and changed_paths == [".github/workflows/ci.yml"]
                  and protected_unchanged
              )
              if workflow_authority and reviewed_feature:
                  raise ValueError("ambiguous trusted content classification")
              if workflow_authority:
                  return "workflow-only-authority", content_base
              if reviewed_feature:
                  return "reviewed-feature-content", content_base
              raise ValueError("unknown trusted content classification")

          workflow_evidence = dict(
